name: Build Smart TOH Backtiming

on:
  push:
    branches:
      - fix/toh-smart-backtiming

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toh-smart-backtiming

      - name: Apply backtiming integration
        run: python3 .github/scripts/apply_toh_backtiming.py

      - name: PHP syntax
        run: |
          php -l backend/src/Radio/AutoDJ/HourBoundaryPlanner.php
          php -l backend/src/Radio/AutoDJ/QueueBuilder.php
          php -l backend/src/Radio/Backend/Liquidsoap/ConfigWriter.php
          php -l backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php
          php -l tests/Unit/TopOfHourSmartBacktimingTest.php
          php -l tests/Unit/TopOfHourPreBoundaryHoldTest.php
          php -l tests/Unit/TopOfHourNewsPriorityTest.php

      - name: Source contract checks
        run: |
          grep -Fq 'secondsAvailableForMusicBeforeTopOfHour' backend/src/Radio/AutoDJ/HourBoundaryPlanner.php
          grep -Fq 'TOH_PRECISION_BACKTIME_SECONDS = 360' backend/src/Radio/AutoDJ/QueueBuilder.php
          grep -Fq 'requestCanFitTopOfHourBoundary' backend/src/Radio/AutoDJ/QueueBuilder.php
          grep -Fq 'synchronous=true, fun (m) -> begin' backend/src/Radio/Backend/Liquidsoap/ConfigWriter.php
          grep -Fq 'PRE_BOUNDARY_HOLD_SECONDS = 75' backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php

      - name: Backtiming math simulation
        run: |
          python3 - <<'PY'
          def ratio(length, target):
              if length <= 0 or target <= 0:
                  return None
              value = target / length
              return round(value, 4) if 0.95 <= value <= 1.05 else None

          target = 240
          candidates = [180, 239, 240, 250]
          ranked = sorted(
              candidates,
              key=lambda length: (
                  0 if ratio(length, target) is not None else 1,
                  abs(1 - ratio(length, target)) if ratio(length, target) is not None else 999,
                  max(0, target - length),
              ),
          )
          assert ranked[0] == 240
          assert ratio(250, 240) == 0.96
          assert ratio(270, 240) is None
          PY

      - name: Liquidsoap 2.4.5 stretch callback check
        run: |
          printf '%s\n' \
            'radio = single("blank:duration=2.")' \
            'clock_wheel_stretch_ratio = ref(1.0)' \
            'source.methods(radio).on_track(synchronous=true, fun (m) -> begin' \
            '  clock_wheel_stretch_ratio := float_of_string(default=1.0, m["liq_stretch_ratio"])' \
            'end)' \
            'radio = stretch(ratio={clock_wheel_stretch_ratio()}, radio)' \
            'output.dummy(radio)' > /tmp/stretch-check.liq
          docker run --rm -v /tmp/stretch-check.liq:/tmp/stretch-check.liq:ro \
            savonet/liquidsoap:v2.4.5 --check /tmp/stretch-check.liq

      - name: Diff sanity
        run: git diff --check

      - name: Commit smart backtiming
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/Radio/AutoDJ/HourBoundaryPlanner.php \
                  backend/src/Radio/AutoDJ/QueueBuilder.php \
                  backend/src/Radio/Backend/Liquidsoap/ConfigWriter.php \
                  backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php \
                  tests/Unit/TopOfHourSmartBacktimingTest.php
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Backtime music into the top-of-hour handoff"
          git push origin HEAD:fix/toh-smart-backtiming
