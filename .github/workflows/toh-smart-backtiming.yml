name: Build Smart TOH Backtiming

on:
  push:
    branches:
      - fix/toh-smart-backtiming

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toh-smart-backtiming

      - name: Apply backtiming integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('backend/src/Radio/AutoDJ/HourBoundaryPlanner.php')
          text = path.read_text()
