name: Part 3 Safe Composer Lock Refresh

on:
  push:
    branches:
      - part3-upstream-sync
    paths:
      - .github/workflows/part3-composer-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: part3-upstream-sync
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: curl, ffi, gd, intl, mbstring, redis, xml, maxminddb
      - name: Validate Composer manifest
        run: composer validate --no-check-publish --no-check-lock
      - name: Refresh dependencies within existing compatible constraints
        run: composer update --with-all-dependencies --no-interaction --prefer-dist
      - name: Require clean Composer security audit
        run: composer audit --locked --no-interaction
      - name: Verify locked install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax check
        run: find backend/src backend/config -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit validated Composer lockfile refresh
        run: |
          if git diff --quiet -- composer.lock; then
            echo "No Composer lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Refresh Composer lockfile with compatible security fixes"
          git push origin HEAD:part3-upstream-sync
