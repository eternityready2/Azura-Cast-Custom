name: TOH Cleanup Driver Probe

on:
  push:
    branches:
      - 'fix/toh-preserve-clean-cut-no-deadlock'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic test audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave

          RATE = 44100

          def write_segments(path, segments):
              with wave.open(path, 'wb') as f:
                  f.setnchannels(2)
                  f.setsampwidth(2)
                  f.setframerate(RATE)
                  for hz, seconds in segments:
                      for i in range(int(RATE * seconds)):
                          s = int(10000 * math.sin(2 * math.pi * hz * i / RATE))
                          f.writeframesraw(struct.pack('<hh', s, s))

          write_segments('/tmp/toh_old.wav', [(440, 20.0)])
          write_segments('/tmp/toh_fresh.wav', [(880, 1.0), (660, 19.0)])
          write_segments('/tmp/toh_third.wav', [(990, 20.0)])
          PY
          rm -rf /tmp/toh_probe_out
          mkdir -p /tmp/toh_probe_out
          chmod 0777 /tmp/toh_probe_out

      - name: Pull Liquidsoap 2.4.5
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run continuity probe
        shell: bash
        run: |
          cat > /tmp/toh_probe.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          request_index = ref(0)
          target = ref(0.)
          id_active = ref(false)
          clean_cut_pending = ref(false)
          cleanup_driver_active = ref(false)

          def next_song() =
            i = request_index()
            request_index := i + 1
            if i == 0 then
              request.create('annotate:title="OLD",song_id="old":/tmp/toh_old.wav')
            elsif i == 1 then
              request.create('annotate:title="FRESH",song_id="fresh":/tmp/toh_fresh.wav')
            else
              request.create('annotate:title="THIRD",song_id="third":/tmp/toh_third.wav')
            end
          end

          dynamic = request.dynamic(
            id="next_song_test",
            timeout=5.,
            retry_delay=0.1,
            next_song
          )

          def dynamic_track(m) =
            title = list.assoc(default="", "title", m)
            log("PROBE_DYNAMIC_TRACK=#{title}")
            if title == "OLD" and target() == 0. then
              target := time() + 3.0
            end
          end
          source.methods(dynamic).on_track(synchronous=true, dynamic_track)

          music = fallback(
            id="dynamic_startup_test",
            track_sensitive=false,
            [dynamic, blank(id="startup_blank")]
          )
          music = stretch(ratio=1.0, music)

          def test_cross(old, new) =
            old_title = list.assoc(default="", "title", old.metadata)
            new_title = list.assoc(default="", "title", new.metadata)
            log("PROBE_CROSS old=#{old_title} new=#{new_title}")
            if clean_cut_pending() then
              clean_cut_pending := false
              log("PROBE_CLEAN_CUT_CONSUMED id_active=#{id_active()}")
              new.source
            else
              cross.simple(old.source, new.source, fade_in=1.0, fade_out=1.0)
            end
          end
          music = cross(id="production_cross_test", duration=5.0, test_cross, music)
          music_prefaded = amplify(1.0, music)

          def stop_cleanup_driver() =
            if cleanup_driver_active() then
              cleanup_driver_active := false
              ignore(server.execute("cleanup_driver_test.stop"))
              log("PROBE_DRIVER_STOP")
            end
          end

          def maintenance_frame() =
            now = time()
            t = target()

            # Pre-arm while the normal music graph is still the selected branch.
            if
              not id_active()
              and t > 0.
              and now >= t - 0.75
              and now < t
              and not cleanup_driver_active()
            then
              cleanup_driver_active := true
              ignore(server.execute("cleanup_driver_test.start"))
              log("PROBE_DRIVER_START_PREARM")
            end

            # Once cross has rejected OLD, stop the independent clock immediately.
            if
              cleanup_driver_active()
              and id_active()
              and not clean_cut_pending()
            then
              stop_cleanup_driver()
              log("PROBE_FRESH_PARKED")
            end
          end
          source.methods(music_prefaded).on_frame(synchronous=false, maintenance_frame)

          output.dummy(
            id="cleanup_driver_test",
            fallible=true,
            register_telnet=true,
            start=false,
            music_prefaded
          )

          legal_id = sine(id="legal_id_test", duration=3.0, 1200.)

          def id_due() =
            t = target()
            if id_active() then
              legal_id.is_ready()
            else
              t > 0. and time() >= t and time() < t + 4.0 and legal_id.is_ready()
            end
          end

          def enter_id(_, new) =
            id_active := true
            if not cleanup_driver_active() then
              cleanup_driver_active := true
              ignore(server.execute("cleanup_driver_test.start"))
              log("PROBE_DRIVER_START_EMERGENCY")
            end
            clean_cut_pending := true
            source.skip(dynamic)
            log("PROBE_ENTER_ID clean-cut armed and dynamic skipped")
            new
          end

          def leave_id(_, new) =
            log("PROBE_EXIT_ID pending=#{clean_cut_pending()} driver=#{cleanup_driver_active()}")
            id_active := false
            if not clean_cut_pending() then
              stop_cleanup_driver()
            end
            new
          end

          radio = switch(
            id="toh_probe_switch",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[enter_id, leave_id],
            [({id_due()}, legal_id), ({true}, music_prefaded)]
          )

          output.file(
            %wav(header=false, samplesize=16),
            "/out/output.pcm",
            fallible=true,
            radio
          )
          EOF

          set +e
          timeout -k 2s 14s docker run --rm \
            -v /tmp/toh_probe.liq:/tmp/toh_probe.liq:ro \
            -v /tmp/toh_old.wav:/tmp/toh_old.wav:ro \
            -v /tmp/toh_fresh.wav:/tmp/toh_fresh.wav:ro \
            -v /tmp/toh_third.wav:/tmp/toh_third.wav:ro \
            -v /tmp/toh_probe_out:/out \
            savonet/liquidsoap:v2.4.5 /tmp/toh_probe.liq \
            > /tmp/toh_probe.log 2>&1
          status=$?
          set -e

          cat /tmp/toh_probe.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            exit "$status"
          fi

          grep -q 'PROBE_DRIVER_START_PREARM' /tmp/toh_probe.log
          grep -q 'PROBE_CLEAN_CUT_CONSUMED id_active=true' /tmp/toh_probe.log
          grep -q 'PROBE_FRESH_PARKED' /tmp/toh_probe.log
          grep -q 'PROBE_EXIT_ID pending=false' /tmp/toh_probe.log
          ! grep -q 'PROBE_DRIVER_START_EMERGENCY' /tmp/toh_probe.log
          test -s /tmp/toh_probe_out/output.pcm

      - name: Analyze recorded audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import pathlib
          import struct

          raw = pathlib.Path('/tmp/toh_probe_out/output.pcm').read_bytes()
          vals = struct.unpack('<' + 'h' * (len(raw) // 2), raw[:len(raw) // 2 * 2])
          samples = vals[0::2]
          rate = 44100
          win = rate // 10
          hop = rate // 20

          def goertzel(xs, freq):
              omega = 2.0 * math.pi * freq / rate
              coeff = 2.0 * math.cos(omega)
              s1 = 0.0
              s2 = 0.0
              for x in xs:
                  s0 = x + coeff * s1 - s2
                  s2, s1 = s1, s0
              return (s1 * s1 + s2 * s2 - coeff * s1 * s2) / (len(xs) * len(xs))

          windows = []
          for start in range(0, len(samples) - win + 1, hop):
              xs = samples[start:start + win]
              p = [goertzel(xs, hz) for hz in (440., 660., 880., 990., 1200.)]
              rms = math.sqrt(sum(float(x) * float(x) for x in xs) / len(xs))
              windows.append((start / rate, *p, rms))

          ids = [w for w in windows if w[5] > 20.0 * (w[1] + w[2] + w[3] + w[4] + 1.0) and w[5] > 1e5]
          if not ids:
              raise SystemExit('ID not found')
          id_end = max(w[0] for w in ids) + win / rate
          post = [w for w in windows if id_end + 0.02 <= w[0] <= id_end + 1.75]
          if not post:
              raise SystemExit('post-ID windows missing')

          if any(w[1] > 1e5 and w[1] > 0.02 * (w[2] + w[3] + w[4] + 1.0) for w in post):
              raise SystemExit('OLD resumed after ID')

          immediate = [w for w in post if w[0] <= id_end + 0.25]
          if not immediate or not any(w[6] > 500.0 for w in immediate):
              raise SystemExit('dead air after ID')

          intro = [w for w in post if w[0] <= id_end + 0.55]
          if not any(w[3] > 1e5 and w[3] > 5.0 * (w[1] + w[2] + w[4] + w[5] + 1.0) for w in intro):
              raise SystemExit('fresh intro was silently advanced')

          body = [w for w in post if id_end + 1.05 <= w[0] <= id_end + 1.55]
          if not any(w[2] > 1e5 and w[2] > 5.0 * (w[1] + w[3] + w[4] + w[5] + 1.0) for w in body):
              raise SystemExit('fresh song did not advance normally after release')

          if any(w[4] > 1e5 for w in post):
              raise SystemExit('fresh successor was double-skipped')

          print('PROBE_PASS: no resume, no dead air, fresh intro preserved, no double-skip')
          PY
