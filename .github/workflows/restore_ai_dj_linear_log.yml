name: Restore AI DJ and Linear Log

on:
  push:
    branches:
      - fix/restore-ai-dj-linear-log

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-ai-dj-linear-log
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Patch production code
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('backend/src/Radio/AutoDJ/AiDjQueueListener.php')
          s = p.read_text()
          a = s.index('    public function onBuildQueue(BuildQueue $event): void')
          b = s.index('    private function trackCurrentSong', a)
          m = s[a:b]
          m = m.replace('    public function onBuildQueue(BuildQueue $event): void', '    public function onBuildQueue(BuildQueue $event): bool', 1)
          m = m.replace('return;', 'return true;')
          pairs = [
              ("AI DJ: Skipped - Liquidsoap requests queue is not empty.');\n            return true;", "AI DJ: Skipped - Liquidsoap requests queue is not empty.');\n            return false;"),
              ("AI DJ: Skipped - cooldown active.', ['elapsed' => time() - $lastGenTime]);\n            return true;", "AI DJ: Skipped - cooldown active.', ['elapsed' => time() - $lastGenTime]);\n            return false;"),
              ("AI DJ: Skipped - a DJ clip is already queued ahead.');\n            return true;", "AI DJ: Skipped - a DJ clip is already queued ahead.');\n            return false;"),
              ("$this->cache->set($cacheKey, $previousDjId, 3600);\n                $this->trackCurrentSong($station);\n                return true;", "$this->cache->set($cacheKey, $previousDjId, 3600);\n                $this->trackCurrentSong($station);\n                return false;"),
          ]
          for old, new in pairs:
              if old not in m:
                  raise SystemExit('AI DJ target not found: ' + old.splitlines()[0])
              m = m.replace(old, new, 1)
          tail = "        $this->trackCurrentSong($station);\n    }\n\n"
          if tail not in m:
              raise SystemExit('AI DJ tail not found')
          m = m.replace(tail, "        $this->trackCurrentSong($station);\n        return true;\n    }\n\n", 1)
          if 'return;' in m:
              raise SystemExit('Bare return remains in AI DJ method')
          p.write_text(s[:a] + m + s[b:])

          p = Path('backend/src/Radio/AutoDJ/Queue.php')
          s = p.read_text()
          old = "        private readonly EventDispatcherInterface $dispatcher,\n        private readonly StationQueueRepository $queueRepo,\n        private readonly Scheduler $scheduler,\n        private readonly QueueLogCache $queueLogCache\n"
          new = "        private readonly EventDispatcherInterface $dispatcher,\n        private readonly StationQueueRepository $queueRepo,\n        private readonly Scheduler $scheduler,\n        private readonly HourBoundaryPlanner $hourBoundaryPlanner,\n        private readonly QueueLogCache $queueLogCache\n"
          if old not in s:
              raise SystemExit('Queue constructor target not found')
          s = s.replace(old, new, 1)
          marker = "            if (empty($nextSongs)) {\n"
          start = s.index(marker, s.index('$maxAttemptsPerSlot'))
          end = s.index("\n\n            foreach ($nextSongs as $queueRow) {", start)
          block = s[start:end]
          if 'Could not find a compliant song for queue slot after max attempts; stopping queue build.' not in block:
              raise SystemExit('Queue stop block not found')
          replacement = '''            if (empty($nextSongs)) {
                if (
                    null !== $lookaheadMinutesOverride
                    && $this->hourBoundaryPlanner->isInTopOfHourIdWindow($station, $expectedPlayTime)
                ) {
                    $resumeAt = CarbonImmutable::instance(
                        $this->hourBoundaryPlanner->getNextTopOfHour(
                            $expectedPlayTime,
                            $station->getTimezoneObject(),
                        )
                    );
                    if ($resumeAt > $expectedPlayTime) {
                        $this->logger->info(
                            'Linear Log: crossing protected top-of-hour window and continuing projection.',
                            ['from' => $expectedPlayTime->format(DateTimeImmutable::ATOM), 'resume_at' => $resumeAt->format(DateTimeImmutable::ATOM)]
                        );
                        $expectedPlayTime = $resumeAt;
                        $expectedCueTime = $resumeAt;
                        $this->em->flush();
                        continue;
                    }
                }
                $this->logger->warning(
                    'Could not find a compliant song for queue slot after max attempts; stopping queue build.',
                    ['attempts' => $attempts]
                );
                $this->em->flush();
                break;
            }'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Validate and commit
        shell: bash
        run: |
          php -l backend/src/Radio/AutoDJ/AiDjQueueListener.php
          php -l backend/src/Radio/AutoDJ/Queue.php
          grep -q 'public function onBuildQueue(BuildQueue $event): bool' backend/src/Radio/AutoDJ/AiDjQueueListener.php
          grep -q 'crossing protected top-of-hour window and continuing projection' backend/src/Radio/AutoDJ/Queue.php
          git diff --check
          rm .github/workflows/restore_ai_dj_linear_log.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore AI DJ retries and linear log continuity'
          git push origin HEAD:fix/restore-ai-dj-linear-log
