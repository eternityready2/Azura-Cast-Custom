name: Validate Linear Log and AI DJ Isolation

on:
  push:
    branches:
      - fix/linear-log-ai-dj-isolation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Syntax check changed PHP files
        run: |
          php -l backend/src/Event/Radio/BuildQueue.php
          php -l backend/src/Radio/AutoDJ/AiDjProjectionSafeListener.php
          php -l backend/src/Radio/AutoDJ/LinearLogBuilder.php
          php -l backend/src/Radio/AutoDJ/Queue.php
          php -l backend/src/Entity/Repository/StationQueueRepository.php
          php -l backend/src/Console/Command/BuildLinearLogCommand.php
          php -l tests/PureUnit/LinearLogProjectionTest.php

      - name: Run focused behavioral test
        run: vendor/bin/phpunit tests/PureUnit/LinearLogProjectionTest.php

      - name: Check patch whitespace
        run: git diff --check HEAD^
