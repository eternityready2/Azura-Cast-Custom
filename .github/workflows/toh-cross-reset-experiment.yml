name: TOH Cross Reset Experiment

on:
  push:
    branches:
      - 'fix/toh-no-deadlock-direct-reset'

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math, struct, wave
          RATE=44100
          def write(path, segments):
              with wave.open(path,'wb') as f:
                  f.setnchannels(2); f.setsampwidth(2); f.setframerate(RATE)
                  for hz,secs in segments:
                      for i in range(int(RATE*secs)):
                          s=int(10000*math.sin(2*math.pi*hz*i/RATE))
                          f.writeframesraw(struct.pack('<hh',s,s))
          write('/tmp/old.wav',[(440,20.)])
          write('/tmp/fresh.wav',[(880,1.),(660,19.)])
          write('/tmp/third.wav',[(990,20.)])
          PY
          mkdir -p /tmp/out && chmod 777 /tmp/out

      - name: Pull Liquidsoap 2.4.5
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run direct cross reset variants
        shell: bash
        run: |
          set -euo pipefail
          for variant in cross_only dynamic_then_cross; do
            cat > /tmp/test.liq <<EOF
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          index = ref(0)
          target = ref(0.)
          id_active = ref(false)

          def next_song() =
            i = index()
            index := i + 1
            if i == 0 then
              request.create('annotate:title="OLD":/tmp/old.wav')
            elsif i == 1 then
              request.create('annotate:title="FRESH":/tmp/fresh.wav')
            else
              request.create('annotate:title="THIRD":/tmp/third.wav')
            end
          end

          dynamic = request.dynamic(id="dyn", timeout=5., retry_delay=0.1, next_song)
          def on_dynamic(m) =
            title = list.assoc(default="", "title", m)
            log("EXP_DYNAMIC=#{title}")
            if title == "OLD" and target() == 0. then target := time() + 2.0 end
          end
          source.methods(dynamic).on_track(synchronous=true, on_dynamic)

          base = fallback(track_sensitive=false,[dynamic,blank(id="startup_blank")])
          base = stretch(ratio=1.0,base)
          def trans(old,new) =
            old_title = list.assoc(default="", "title", old.metadata)
            new_title = list.assoc(default="", "title", new.metadata)
            log("EXP_CROSS_CALLBACK old=#{old_title} new=#{new_title}")
            cross.simple(old.source,new.source,fade_in=1.0,fade_out=1.0)
          end
          crossed = cross(id="crossed",duration=5.0,trans,base)

          legal = sine(id="legal",duration=3.0,1200.)
          def due() =
            if id_active() then legal.is_ready()
            else target() > 0. and time() >= target() and time() < target()+4. and legal.is_ready()
            end
          end

          def enter(_,new) =
            id_active := true
            log("EXP_ENTER variant=${variant}")
            if "${variant}" == "cross_only" then
              source.skip(crossed)
            else
              source.skip(dynamic)
              source.skip(crossed)
            end
            new
          end
          def leave(_,new) =
            id_active := false
            log("EXP_EXIT")
            new
          end

          radio = switch(track_sensitive=false,replay_metadata=true,transition_length=0.0,
            transitions=[enter,leave],[({due()},legal),({true},crossed)])
          output.file(%wav(header=false,samplesize=16),"/out/${variant}.pcm",fallible=true,radio)
          EOF

            set +e
            timeout -k 2s 11s docker run --rm \
              -v /tmp/test.liq:/tmp/test.liq:ro \
              -v /tmp/old.wav:/tmp/old.wav:ro \
              -v /tmp/fresh.wav:/tmp/fresh.wav:ro \
              -v /tmp/third.wav:/tmp/third.wav:ro \
              -v /tmp/out:/out \
              savonet/liquidsoap:v2.4.5 /tmp/test.liq > /tmp/${variant}.log 2>&1
            status=$?
            set -e
            echo "===== ${variant} status=${status} ====="
            cat /tmp/${variant}.log
            if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then exit "$status"; fi
          done

      - name: Analyze post-ID audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math, pathlib, struct
          RATE=44100
          def power(xs,f):
              omega=2*math.pi*f/RATE; coeff=2*math.cos(omega); s1=s2=0.
              for x in xs:
                  s0=x+coeff*s1-s2; s2,s1=s1,s0
              return (s1*s1+s2*s2-coeff*s1*s2)/(len(xs)*len(xs))
          for variant in ('cross_only','dynamic_then_cross'):
              p=pathlib.Path('/tmp/out/'+variant+'.pcm')
              if not p.exists():
                  raise SystemExit('RESULT '+variant+' NO_OUTPUT')
              raw=p.read_bytes(); vals=struct.unpack('<'+'h'*(len(raw)//2),raw[:len(raw)//2*2]); samples=vals[0::2]
              win=RATE//10; hop=RATE//20; rows=[]
              for s in range(0,len(samples)-win+1,hop):
                  xs=samples[s:s+win]
                  rows.append((s/RATE,power(xs,440),power(xs,660),power(xs,880),power(xs,990),power(xs,1200)))
              ids=[r for r in rows if r[5] > 1e5 and r[5] > 20*(r[1]+r[2]+r[3]+r[4]+1)]
              if not ids:
                  raise SystemExit('RESULT '+variant+' NO_ID')
              end=max(r[0] for r in ids)+win/RATE
              post=[r for r in rows if end+.05 <= r[0] <= end+1.5]
              old=any(r[1] > 1e5 and r[1] > 0.02*(r[2]+r[3]+r[4]+1) for r in post)
              fresh_intro=any(r[3] > 1e5 and r[3] > 5*(r[1]+r[2]+r[4]+r[5]+1) for r in post if r[0] <= end+.55)
              body=any(r[2] > 1e5 and r[2] > 5*(r[1]+r[3]+r[4]+r[5]+1) for r in post if end+1.05 <= r[0] <= end+1.5)
              third=any(r[4] > 1e5 for r in post)
              print('RESULT',variant,'id_end',round(end,3),'old_leak',old,'fresh_intro',fresh_intro,'fresh_body',body,'third',third)
              for r in post[:12]: print('POST',variant,*[round(x,3) if i==0 else round(x) for i,x in enumerate(r)])
          PY
