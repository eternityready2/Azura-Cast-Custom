name: Part 3 Safe NPM Lock Refresh

on:
  push:
    branches:
      - part3-upstream-sync
    paths:
      - .github/workflows/part3-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: part3-upstream-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply non-breaking audit fixes to lockfile only
        run: npm audit fix --package-lock-only
      - name: Verify clean install
        run: npm ci
      - name: Require no high severity production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Verify production build
        run: npm run build
      - name: Commit validated lockfile refresh
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh NPM lockfile with compatible security fixes"
          git push origin HEAD:part3-upstream-sync
