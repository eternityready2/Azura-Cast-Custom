name: TOH Runtime Validation

on:
  push:
    branches:
      - 'fix/toh-*'
      - 'feature/top-of-hour-plugin-rebuild'
      - dev
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/azuracast.liq'
      - 'backend/config/events.php'
      - 'backend/src/Event/Radio/ResolveQueueClockConstraint.php'
      - 'backend/src/Radio/AutoDJ/Queue.php'
      - 'backend/src/Radio/AutoDJ/TopOfHour/**'
      - 'backend/src/Radio/AutoDJ/BroadcastClockPlanner.php'
      - 'backend/src/Radio/Backend/Liquidsoap/TopOfHourAiNewsConfigurationGuard.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'tests/Unit/BroadcastClockPlannerTest.php'
      - 'tests/Unit/RigidScheduleRuntimeConfigurationTest.php'
      - 'tests/Unit/TopOfHourClockTest.php'
      - 'tests/Unit/TopOfHourQueueClockConstraintTest.php'
      - 'tests/Unit/TopOfHourRuntimeConfigurationTest.php'
      - '.github/workflows/toph-runtime-validation.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/azuracast.liq'
      - 'backend/config/events.php'
      - 'backend/src/Event/Radio/ResolveQueueClockConstraint.php'
      - 'backend/src/Radio/AutoDJ/Queue.php'
      - 'backend/src/Radio/AutoDJ/TopOfHour/**'
      - 'backend/src/Radio/AutoDJ/BroadcastClockPlanner.php'
      - 'backend/src/Radio/Backend/Liquidsoap/TopOfHourAiNewsConfigurationGuard.php'
      - 'backend/src/Sync/Task/StageTopOfHourStationIdTask.php'
      - 'tests/Unit/**TopOfHour**'
      - 'tests/Unit/RigidScheduleRuntimeConfigurationTest.php'
      - '.github/workflows/toph-runtime-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate plugin ownership and single-authority handoff architecture
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          test -f plugins/top_of_hour/events.php
          test -f plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          test -f plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          test -f plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          test -f backend/src/Event/Radio/ResolveQueueClockConstraint.php

          test ! -e backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          test ! -e backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          ! grep -q 'RigidScheduleRuntimeConfiguration' backend/config/events.php
          ! grep -q 'TopOfHourRuntimeConfiguration' backend/config/events.php

          grep -q 'StageTopOfHourStationIdTask' plugins/top_of_hour/events.php
          grep -q 'RigidScheduleRuntimeConfiguration::class' plugins/top_of_hour/events.php
          grep -q 'TopOfHourQueueClockConstraint::class' plugins/top_of_hour/events.php
          grep -q 'TopOfHourRuntimeConfiguration::class' plugins/top_of_hour/events.php

          # The failed quarantine architecture is gone. It created a competing
          # state machine and could recycle freshly sent rows back to unsent.
          test ! -e plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          test ! -e plugins/top_of_hour/src/RetiredSongQueueGuard.php
          test ! -e backend/src/Radio/AutoDJ/AutoDjRetirementService.php
          ! grep -q 'AutoDjRetirementRuntimeConfiguration' plugins/top_of_hour/events.php
          ! grep -q 'RetiredSongQueueGuard' plugins/top_of_hour/events.php
          ! grep -q 'AutoDjRetirementService' backend/src/Radio/AutoDJ/Annotations.php
          ! grep -q 'AutoDjRetirementService' backend/src/Radio/Backend/Liquidsoap/Command/NextSongCommand.php
          ! grep -q 'AutoDjRetirementService' backend/src/Radio/Backend/Liquidsoap/Command/FeedbackCommand.php

          # #160's live-proven contract is non-negotiable: arm the real AutoDJ
          # clean-cut, keep the same processed graph continuously activated across
          # takeover, and let cross reject old.source. The maintenance output is
          # pre-armed before the outer switch and stopped immediately after cross
          # clears the marker, parking FRESH instead of advancing it through ID.
          grep -q 'azuracast.discard_autodj_current_cleanly()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'source.methods(radio_before_top_of_hour).on_frame' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'id="top_of_hour_cleanup_driver"' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'register_telnet=true' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'start=false' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'server.execute("top_of_hour_cleanup_driver.start")' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'server.execute("top_of_hour_cleanup_driver.stop")' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'pre-armed continuous #160 cleanup clock before takeover.' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'clean cross boundary consumed; parked fresh AutoDJ successor.' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # #161 must never return: its activation-changing cleanup switch could
          # fail to run cross, and its pending marker then held TOH on silence.
          ! grep -q 'top_of_hour_cleanup_underlay = switch' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'or azuracast.autodj_clean_cut_pending()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # #162 must never return: bypassing/clearing the cross clean-cut before
          # the callback ran reintroduced the interrupted-song resume live.
          ! grep -q 'broadcast_clock_cross_source = radio' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'source.skip(broadcast_clock_cross_source)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'azuracast.autodj_clean_cut_pending := false' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'broadcast_clock_retire_outgoing' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # output.dummy returns unit in Liquidsoap 2.4.5. Never assign it and then
          # call source methods on the result; lifecycle uses registered commands.
          ! grep -q 'top_of_hour_cleanup_driver = output.dummy' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # Shared common-runtime cross callback remains the sole normal owner of
          # marker consumption and old.source rejection.
          grep -q 'let azuracast.autodj_clean_cut_pending = ref(false)' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'def azuracast.discard_autodj_current_cleanly()' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'if azuracast.autodj_clean_cut_pending() then' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'Broadcast-clock clean cut: discarded buffered old crossfade tail.' util/docker/stations/liquidsoap/azuracast.liq

          # Rigid scheduled takeovers still use their existing one-shot clean-cut
          # path. Their switch never waits on the pending marker.
          grep -q 'def rigid_schedule_enter(_, new)' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          grep -q 'azuracast.discard_autodj_current_cleanly()' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'broadcast_clock_retire_outgoing' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php

          # The delayed inner gate seen in earlier live logs must never return.
          ! grep -q 'broadcast_clock_autodj_gate' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'broadcast_clock_autodj_blocked' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'fallback.skip(' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'source.available(' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'broadcast_clock_release_when_fresh' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'broadcast_clock_prefetch_autodj' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # HARD TOH keeps the same authoritative lane selected through :00.
          grep -q 'top_of_hour_hard_hold = blank' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q '\[top_of_hour_id, top_of_hour_hard_hold\]' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'boundary > 0.0 and now < boundary' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'top_of_hour_hard_release_epoch' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

          # Core has one generic forecast seam. TOH policy remains plugin-owned,
          # and TOH must never hard-cap a future ordinary queue row.
          grep -q 'ResolveQueueClockConstraint' backend/src/Radio/AutoDJ/Queue.php
          grep -q 'top_of_hour_station_id' plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          grep -q 'if (!\$this->clock->isEnabled(\$station))' plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          grep -q 'if (null !== \$event->getQueueRow())' plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php
          ! grep -q 'TopOfHourClock' backend/src/Radio/AutoDJ/Queue.php

          # Existing duplicate prevention from the normal queue remains intact.
          grep -q 'getPlayedMusicHistoryByTimeRange' backend/src/Radio/AutoDJ/Queue.php
          grep -q '\$nextSongs\[0\]->song_id === \$lastSongId' backend/src/Radio/AutoDJ/Queue.php

      - name: PHP syntax check changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/dev...HEAD -- '*.php' | while read -r f; do test -f "$f" && echo "$f"; done)
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Liquidsoap 2.4.5 common-runtime parse
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint liquidsoap \
            -v "$PWD/util/docker/stations/liquidsoap:/liq:ro" \
            -w /liq savonet/liquidsoap:v2.4.5 --check azuracast.liq

      - name: Liquidsoap 2.4.5 cleanup lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/toh-cleanup-lifecycle-smoke.liq <<'EOF'
          init.daemon := false

          music = blank(id="music")
          active = ref(false)

          def maintenance() =
            if active() then
              active := false
              ignore(server.execute("cleanup_smoke.stop"))
            end
          end
          source.methods(music).on_frame(synchronous=false, maintenance)

          output.dummy(
            id="cleanup_smoke",
            fallible=true,
            register_telnet=true,
            start=false,
            music
          )

          def start_once() =
            active := true
            ignore(server.execute("cleanup_smoke.start"))
          end
          thread.run(start_once)
          output.dummy(music)
          EOF
          docker run --rm --entrypoint liquidsoap \
            -v /tmp/toh-cleanup-lifecycle-smoke.liq:/tmp/toh-cleanup-lifecycle-smoke.liq:ro \
            savonet/liquidsoap:v2.4.5 --check /tmp/toh-cleanup-lifecycle-smoke.liq

      - name: Install PHP analysis dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/azuracast/www/plugins
          sudo chown -R "$USER":"$(id -gn)" /var/azuracast

      - name: Execute TOH unit and live-incident regressions
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/codecept run tests/Unit/RigidScheduleRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/TopOfHourRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/TopOfHourQueueClockConstraintTest.php

      - name: PHPStan TOH integration
        shell: bash
        run: |
          cat > phpstan.toph.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF
          vendor/bin/phpstan analyze -c phpstan.toph.neon --memory-limit=-1 --no-progress \
            backend/src/Event/Radio/ResolveQueueClockConstraint.php \
            backend/src/Radio/AutoDJ/Queue.php \
            backend/src/Radio/AutoDJ/TopOfHour \
            plugins/top_of_hour/events.php \
            plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php \
            plugins/top_of_hour/src/TopOfHourQueueClockConstraint.php \
            plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php \
            tests/Unit/RigidScheduleRuntimeConfigurationTest.php \
            tests/Unit/TopOfHourClockTest.php \
            tests/Unit/TopOfHourQueueClockConstraintTest.php \
            tests/Unit/TopOfHourRuntimeConfigurationTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check TOH frontend
        run: |
          cat > tsconfig.toph.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "frontend/**/*.d.ts",
              "frontend/components/Stations/TopOfHour.vue",
              "frontend/entities/TopOfHour.ts"
            ],
            "exclude": ["node_modules"]
          }
          EOF
          npx vue-tsc -p tsconfig.toph.json --noEmit

      - name: Lint TOH frontend
        run: npx eslint frontend/components/Stations/TopOfHour.vue frontend/entities/TopOfHour.ts
