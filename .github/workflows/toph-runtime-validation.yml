name: TOH Runtime Validation

on:
  push:
    branches:
      - 'fix/toh-*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate diff and TOH architecture
        run: |
          git diff --check origin/dev...HEAD
          test ! -e backend/src/Radio/AutoDJ/TopOfHour/TopOfHourQueueSubscriber.php
          grep -q 'case TopOfHour' backend/src/Radio/Enums/LiquidsoapQueues.php
          grep -q 'top_of_hour_id_target_epoch' backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          grep -q 'track_sensitive=false' backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          grep -q 'top_of_hour_underlying_gain' backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          grep -q 'azuracast.discard_autodj_current()' backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          ! grep -q 'source.skip(source.effective(' backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          grep -q 'RigidScheduleRuntimeConfiguration' backend/config/events.php
          grep -q 'priority 20' backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          grep -q "WriteLiquidsoapConfiguration::class => \['writeRuntime', 16\]" backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          grep -q 'rigid_schedule_runtime' backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          grep -q 'azuracast.discard_autodj_current()' backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'source.skip(source.effective(' backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          grep -q 'Dedicated native source for an AutoDJ-only rigid scheduled programme' backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          grep -q 'PlaylistFileWriter::getPlaylistFilePath' backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          grep -q 'let azuracast.autodj_transport = ref(blank' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'azuracast.autodj_transport := dynamic' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'def azuracast.discard_autodj_current()' util/docker/stations/liquidsoap/azuracast.liq
          grep -q 'source.skip(azuracast.autodj_transport())' util/docker/stations/liquidsoap/azuracast.liq
          ! grep -q 'secondsUntilPlayoutAnchor' backend/src/Radio/AutoDJ/BroadcastClockPlanner.php
          grep -q 'StageTopOfHourStationIdTask' backend/config/events.php
          grep -q 'top_of_hour_legal_id = 0' backend/src/Entity/Repository/StationQueueRepository.php
          grep -q 'queue_top_hour_news_bulletin' backend/src/Radio/Backend/Liquidsoap/TopOfHourAiNewsConfigurationGuard.php

      - name: PHP syntax check changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/dev...HEAD -- '*.php' | while read -r f; do test -f "$f" && echo "$f"; done)
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Liquidsoap 2.4.5 runtime syntax smoke test
        shell: bash
        run: |
          set -euo pipefail

          # Parse the real common AzuraCast Liquidsoap runtime. This catches type
          # errors in the direct request.dynamic transport reference itself.
          docker run --rm --entrypoint liquidsoap \
            -v "$PWD/util/docker/stations/liquidsoap:/liq:ro" \
            -w /liq \
            savonet/liquidsoap:v2.4.5 \
            --check azuracast.liq

          cat > /tmp/toh-rigid-smoke.liq <<'EOF'
          init.daemon := false

          interrupting_queue = request.queue(id="interrupting_queue", timeout=20.)
          top_of_hour_id = request.queue(id="top_of_hour_id", timeout=20.)
          live_enabled = ref(false)

          autodj_transport = ref(blank(id="autodj_transport_placeholder", duration=0.))
          autodj_transport_ready = ref(false)
          autodj_dynamic = request.queue(id="autodj_dynamic", timeout=20.)
          autodj_transport := autodj_dynamic
          autodj_transport_ready := true

          def discard_autodj_current() =
            if autodj_transport_ready() then
              source.skip(autodj_transport())
            end
          end

          underlying = fallback(track_sensitive=false, [autodj_dynamic, blank()])
          rigid_a = blank(id="rigid_a")
          rigid_b = blank(id="rigid_b")

          def take_rigid(_, new) =
            if not live_enabled() then
              discard_autodj_current()
            end
            interrupting_queue.skip()
            interrupting_queue.set_queue([])
            new
          end

          def release_rigid(_, new) =
            interrupting_queue.skip()
            interrupting_queue.set_queue([])
            new
          end

          rigid = switch(
            id="rigid_schedule_runtime",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[take_rigid, take_rigid, release_rigid],
            [
              ({false}, rigid_a),
              ({false}, rigid_b),
              ({true}, underlying)
            ]
          )

          def toh_enter(_, new) =
            if not live_enabled() then
              discard_autodj_current()
            end
            new
          end

          def toh_exit(_, new) =
            top_of_hour_id.skip()
            top_of_hour_id.set_queue([])
            new
          end

          radio = switch(
            id="top_of_hour_station_id",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[toh_enter, toh_exit],
            [
              ({false}, top_of_hour_id),
              ({true}, rigid)
            ]
          )

          output.dummy(radio)
          EOF

          docker run --rm --entrypoint liquidsoap \
            -v /tmp/toh-rigid-smoke.liq:/tmp/toh-rigid-smoke.liq:ro \
            savonet/liquidsoap:v2.4.5 \
            --version

          docker run --rm --entrypoint liquidsoap \
            -v /tmp/toh-rigid-smoke.liq:/tmp/toh-rigid-smoke.liq:ro \
            savonet/liquidsoap:v2.4.5 \
            --check /tmp/toh-rigid-smoke.liq

      - name: Install PHP analysis dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Execute TOH handoff regression assertions
        shell: bash
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          require getcwd() . '/vendor/autoload.php';

          use App\Entity\Enums\PlaylistSources;
          use App\Entity\Enums\PlaylistTypes;
          use App\Entity\Station;
          use App\Entity\StationPlaylist;
          use App\Entity\StationSchedule;
          use App\Event\Radio\WriteLiquidsoapConfiguration;
          use App\Radio\AutoDJ\BroadcastClockPlanner;
          use App\Radio\AutoDJ\Scheduler;
          use App\Radio\Backend\Liquidsoap\RigidScheduleRuntimeConfiguration;

          $check = static function (bool $condition, string $message): void {
              if (!$condition) {
                  fwrite(STDERR, "Regression assertion failed: {$message}\n");
                  exit(1);
              }
          };

          $constructor = (new ReflectionClass(BroadcastClockPlanner::class))->getConstructor();
          $check(null !== $constructor, 'BroadcastClockPlanner constructor is missing.');
          $parameters = $constructor->getParameters();
          $check(1 === count($parameters), 'BroadcastClockPlanner regained a TOH/rigid timing dependency.');
          $check(Scheduler::class === (string)$parameters[0]->getType(), 'BroadcastClockPlanner dependency is not Scheduler only.');

          $station = new Station();
          $station->name = 'TOH CI Runtime';
          $station->short_name = 'toh_ci_runtime';
          $station->timezone = 'UTC';
          $station->radio_base_dir = '/tmp/toh_ci_runtime';
          $station->backend_config->write_playlists_to_liquidsoap = false;
          $station->backend_config->use_manual_autodj = false;

          $playlist = new StationPlaylist($station);
          $playlist->name = 'Scheduled Program';
          $playlist->source = PlaylistSources::Songs;
          $playlist->type = PlaylistTypes::Standard;
          $playlist->is_enabled = true;

          $schedule = new StationSchedule($playlist);
          $schedule->start_time = 1100;
          $schedule->end_time = 1200;
          $schedule->days = [];
          $schedule->strict_start = true;

          $station->playlists->add($playlist);
          $playlist->schedule_items->add($schedule);

          $event = new WriteLiquidsoapConfiguration($station, false, false);
          (new RigidScheduleRuntimeConfiguration())->writeRuntime($event);
          $config = $event->buildConfiguration();

          $check(
              str_contains($config, '# Dedicated native source for an AutoDJ-only rigid scheduled programme.'),
              'AutoDJ-only strict playlist has no native wall-clock source.',
          );
          $check(str_contains($config, 'rigid_playlist_scheduled_program_'), 'Dedicated rigid source variable is missing.');
          $check(str_contains($config, 'mode="randomize"'), 'Dedicated rigid source did not preserve playlist order.');
          $check(str_contains($config, '11h0m-12h0m'), 'Strict schedule predicate is missing or incorrect.');
          $check(str_contains($config, 'id="rigid_schedule_runtime"'), 'Rigid wall-clock switch is missing.');
          $check(
              str_contains($config, 'azuracast.discard_autodj_current()'),
              'Rigid takeover does not call the direct AutoDJ transport discard.',
          );
          $check(
              !str_contains($config, 'source.skip(source.effective('),
              'Rigid runtime still relies on an effective-source wrapper guess.',
          );

          fwrite(STDOUT, "TOH handoff regression assertions passed.\n");
          PHP

      - name: Prepare AzuraCast PHPStan runtime
        run: |
          sudo mkdir -p /var/azuracast/www/plugins
          cat > phpstan.toph.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF

      - name: PHPStan TOH runtime integration
        run: >-
          vendor/bin/phpstan analyze -c phpstan.toph.neon --memory-limit=-1 --no-progress
          backend/config/events.php
          backend/src/Controller/Api/Stations/TopOfHour
          backend/src/Entity/Repository/StationQueueRepository.php
          backend/src/Radio/AutoDJ/TopOfHour
          backend/src/Radio/AutoDJ/BroadcastClockPlanner.php
          backend/src/Radio/Backend/Liquidsoap/RigidScheduleRuntimeConfiguration.php
          backend/src/Radio/Backend/Liquidsoap/TopOfHourAiNewsConfigurationGuard.php
          backend/src/Radio/Backend/Liquidsoap/TopOfHourRuntimeConfiguration.php
          backend/src/Sync/Task/QueueInterruptingTracks.php
          backend/src/Sync/Task/StageTopOfHourStationIdTask.php
          tests/Unit/BroadcastClockPlannerTest.php
          tests/Unit/RigidScheduleRuntimeConfigurationTest.php
          tests/Unit/TopOfHourClockTest.php
          tests/Unit/TopOfHourRuntimeConfigurationTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check TOH frontend
        run: |
          cat > tsconfig.toph.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "frontend/**/*.d.ts",
              "frontend/components/Stations/TopOfHour.vue",
              "frontend/entities/TopOfHour.ts"
            ],
            "exclude": ["node_modules"]
          }
          EOF
          npx vue-tsc -p tsconfig.toph.json --noEmit

      - name: Lint TOH frontend
        run: npx eslint frontend/components/Stations/TopOfHour.vue frontend/entities/TopOfHour.ts