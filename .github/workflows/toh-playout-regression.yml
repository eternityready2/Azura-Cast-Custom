name: TOH Playout Regression

on:
  push:
    branches:
      - 'fix/toh-*'
      - dev
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/**'
      - '.github/workflows/toh-playout-regression.yml'

permissions:
  contents: read

jobs:
  no-resume-no-deadlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify runtime preserves clean-cut and never gates TOH release on it
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'azuracast.discard_autodj_current_cleanly()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'top_of_hour_cleanup_driver = output.dummy' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'top_of_hour_cleanup_driver.start()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          grep -q 'top_of_hour_cleanup_driver.stop()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'source.skip(broadcast_clock_cross_source)' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'azuracast.autodj_clean_cut_pending := false' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'or azuracast.autodj_clean_cut_pending()' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php
          ! grep -q 'top_of_hour_cleanup_underlay = switch' plugins/top_of_hour/src/TopOfHourRuntimeConfiguration.php

      - name: Generate deterministic test audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave

          RATE = 44100

          def write_segments(path, segments):
              with wave.open(path, 'wb') as f:
                  f.setnchannels(2)
                  f.setsampwidth(2)
                  f.setframerate(RATE)
                  for hz, seconds in segments:
                      for i in range(int(RATE * seconds)):
                          s = int(10000 * math.sin(2 * math.pi * hz * i / RATE))
                          f.writeframesraw(struct.pack('<hh', s, s))

          # OLD is the song interrupted by the legal ID.
          write_segments('/tmp/toh_old.wav', [(440, 20.0)])
          # FRESH has a unique one-second opening. If cleanup keeps clocking after
          # the cross callback, 880 Hz disappears before the ID releases.
          write_segments('/tmp/toh_fresh.wav', [(880, 1.0), (660, 19.0)])
          # THIRD catches an accidental double-skip of FRESH.
          write_segments('/tmp/toh_third.wav', [(990, 20.0)])
          PY
          rm -rf /tmp/toh_regression_out
          mkdir -p /tmp/toh_regression_out
          chmod 0777 /tmp/toh_regression_out

      - name: Pull production Liquidsoap image
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run production-shaped clean-cut with direct cleanup driver
        shell: bash
        run: |
          cat > /tmp/toh_resume_regression.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          request_index = ref(0)
          cut_target = ref(0.)
          id_active = ref(false)
          clean_cut_pending = ref(false)

          def next_song() =
            i = request_index()
            request_index := i + 1
            if i == 0 then
              request.create('annotate:title="OLD",song_id="old":/tmp/toh_old.wav')
            elsif i == 1 then
              request.create('annotate:title="FRESH",song_id="fresh":/tmp/toh_fresh.wav')
            else
              request.create('annotate:title="THIRD",song_id="third":/tmp/toh_third.wav')
            end
          end

          # Match production AutoDJ: request.dynamic with no synthetic prefetch.
          dynamic = request.dynamic(
            id="next_song_test",
            timeout=5.,
            retry_delay=0.1,
            next_song
          )

          def dynamic_track(m) =
            title = list.assoc(default="", "title", m)
            log("TOH_REGRESSION_DYNAMIC_TRACK=#{title}")
            if title == "OLD" and cut_target() == 0. then
              cut_target := time() + 2.0
            end
          end
          source.methods(dynamic).on_track(synchronous=true, dynamic_track)

          music = fallback(
            id="dynamic_startup_test",
            track_sensitive=false,
            [dynamic, blank(id="startup_blank")]
          )
          music = stretch(ratio=1.0, music)

          def test_cross(old, new) =
            old_title = list.assoc(default="", "title", old.metadata)
            new_title = list.assoc(default="", "title", new.metadata)
            log("TOH_REGRESSION_CROSS old=#{old_title} new=#{new_title}")

            if clean_cut_pending() then
              clean_cut_pending := false
              log("TOH_REGRESSION_CROSS clean-cut consumed id_active=#{id_active()}")
              new.source
            else
              cross.simple(old.source, new.source, fade_in=1.0, fade_out=1.0)
            end
          end
          music = cross(id="production_cross_test", duration=5.0, test_cross, music)
          music_prefaded = amplify(1.0, music)

          # Direct maintenance driver: there is intentionally NO switch between
          # this output and the processed cross source. This mirrors #160's live-
          # proven clocking path, but stops as soon as clean_cut_pending clears.
          let {
            audio=cleanup_audio_track,
            ...cleanup_non_audio
          } = source.tracks(music_prefaded)
          ignore(cleanup_non_audio)
          cleanup_audio = source(id="cleanup_audio_test", {audio=cleanup_audio_track})
          cleanup_audio = amplify(0.0, cleanup_audio)
          cleanup_driver = output.dummy(
            id="cleanup_driver_test",
            fallible=true,
            register_telnet=false,
            start=false,
            cleanup_audio
          )

          def cleanup_after_frame() =
            if not clean_cut_pending() then
              log("TOH_REGRESSION_DRIVER_STOP clean-cut complete")
              cleanup_driver.stop()
            end
          end
          source.methods(cleanup_driver).on_frame(synchronous=true, cleanup_after_frame)

          legal_id = sine(id="legal_id_test", duration=3.0, 1200.)

          def id_due() =
            target = cut_target()
            if id_active() then
              # Critical #161 regression: never keep the ID lane selected because
              # cleanup is pending. The ID itself is the only open-hour hold.
              legal_id.is_ready()
            else
              target > 0.
              and time() >= target
              and time() < target + 4.0
              and legal_id.is_ready()
            end
          end

          def enter_id(_, new) =
            id_active := true
            clean_cut_pending := true
            source.skip(dynamic)
            cleanup_driver.start()
            log("TOH_REGRESSION_ENTER clean-cut armed; dynamic skipped; direct driver started")
            new
          end

          def leave_id(_, new) =
            log("TOH_REGRESSION_EXIT pending=#{clean_cut_pending()}")
            id_active := false
            if not clean_cut_pending() then cleanup_driver.stop() end
            new
          end

          radio = switch(
            id="toh_regression_switch",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[enter_id, leave_id],
            [({id_due()}, legal_id), ({true}, music_prefaded)]
          )

          output.file(
            %wav(header=false, samplesize=16),
            "/out/output.pcm",
            fallible=true,
            radio
          )
          EOF

          set +e
          timeout -k 2s 12s docker run --rm \
            -v /tmp/toh_resume_regression.liq:/tmp/toh_resume_regression.liq:ro \
            -v /tmp/toh_old.wav:/tmp/toh_old.wav:ro \
            -v /tmp/toh_fresh.wav:/tmp/toh_fresh.wav:ro \
            -v /tmp/toh_third.wav:/tmp/toh_third.wav:ro \
            -v /tmp/toh_regression_out:/out \
            savonet/liquidsoap:v2.4.5 /tmp/toh_resume_regression.liq \
            > /tmp/toh_resume_regression.log 2>&1
          status=$?
          set -e

          cat /tmp/toh_resume_regression.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            echo "Liquidsoap regression harness failed with status $status" >&2
            exit "$status"
          fi

          grep -q 'TOH_REGRESSION_DYNAMIC_TRACK=OLD' /tmp/toh_resume_regression.log
          test "$(grep -c 'TOH_REGRESSION_ENTER clean-cut armed; dynamic skipped; direct driver started' /tmp/toh_resume_regression.log)" -eq 1
          grep -q 'TOH_REGRESSION_CROSS clean-cut consumed id_active=true' /tmp/toh_resume_regression.log
          grep -q 'TOH_REGRESSION_DRIVER_STOP clean-cut complete' /tmp/toh_resume_regression.log
          grep -q 'TOH_REGRESSION_EXIT pending=false' /tmp/toh_resume_regression.log
          test -s /tmp/toh_regression_out/output.pcm

      - name: Assert no resume, no silent advance, no dead air, and no double-skip
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import pathlib
          import struct

          path = pathlib.Path('/tmp/toh_regression_out/output.pcm')
          raw = path.read_bytes()
          if len(raw) < 44100 * 4 * 7:
              raise SystemExit(f'Output too short: {len(raw)} bytes')

          vals = struct.unpack('<' + 'h' * (len(raw) // 2), raw[:len(raw) // 2 * 2])
          samples = vals[0::2]
          rate = 44100
          win = rate // 10
          hop = rate // 20

          def goertzel(xs, freq):
              omega = 2.0 * math.pi * freq / rate
              coeff = 2.0 * math.cos(omega)
              s1 = 0.0
              s2 = 0.0
              for x in xs:
                  s0 = x + coeff * s1 - s2
                  s2, s1 = s1, s0
              return (s1 * s1 + s2 * s2 - coeff * s1 * s2) / (len(xs) * len(xs))

          windows = []
          for start in range(0, len(samples) - win + 1, hop):
              xs = samples[start:start + win]
              powers = [goertzel(xs, hz) for hz in (440.0, 660.0, 880.0, 990.0, 1200.0)]
              rms = math.sqrt(sum(float(x) * float(x) for x in xs) / len(xs))
              windows.append((start / rate, *powers, rms))

          id_windows = [
              w for w in windows
              if w[5] > 20.0 * (w[1] + w[2] + w[3] + w[4] + 1.0) and w[5] > 1e5
          ]
          if not id_windows:
              raise SystemExit('Could not locate deterministic 1200 Hz ID')

          id_end = max(w[0] for w in id_windows) + win / rate
          post = [w for w in windows if id_end + 0.02 <= w[0] <= id_end + 1.75]
          if not post:
              raise SystemExit('No post-ID analysis windows')

          # 1) OLD 440 Hz must be permanently gone after legal ID.
          if any(
              w[1] > 1e5 and w[1] > 0.02 * (w[2] + w[3] + w[4] + 1.0)
              for w in post
          ):
              raise SystemExit('TOH_REGRESSION_FAIL: interrupted OLD song resumed after ID')

          # 2) Audio must return essentially immediately after ID; #161's dead
          # silence must never be recreated.
          immediate = [w for w in post if w[0] <= id_end + 0.25]
          if not immediate or not any(w[6] > 500.0 for w in immediate):
              raise SystemExit('TOH_REGRESSION_FAIL: dead air after ID release')

          # 3) FRESH must still be at its unique 880 Hz opening after ID. This
          # proves the maintenance driver stopped once the clean boundary fired.
          intro = [w for w in post if w[0] <= id_end + 0.55]
          if not any(
              w[3] > 1e5 and w[3] > 5.0 * (w[1] + w[2] + w[4] + w[5] + 1.0)
              for w in intro
          ):
              raise SystemExit('TOH_REGRESSION_FAIL: fresh song advanced beneath ID')

          # 4) FRESH then advances normally once it is actually on air.
          body = [w for w in post if id_end + 1.05 <= w[0] <= id_end + 1.55]
          if not any(
              w[2] > 1e5 and w[2] > 5.0 * (w[1] + w[3] + w[4] + w[5] + 1.0)
              for w in body
          ):
              raise SystemExit('TOH_REGRESSION_FAIL: fresh song did not advance after release')

          # THIRD 990 Hz means FRESH was accidentally skipped too.
          if any(w[4] > 1e5 for w in post):
              raise SystemExit('TOH_REGRESSION_FAIL: fresh successor was double-skipped')

          print('TOH_REGRESSION_PASS: old gone; fresh starts at opening immediately; no dead air or double-skip')
          PY
