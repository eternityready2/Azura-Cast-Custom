name: TOH Playout Regression

on:
  push:
    branches:
      - 'fix/toh-direct-source-retirement'
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/**'
      - '.github/workflows/toh-playout-regression.yml'

permissions:
  contents: read

jobs:
  no-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic test audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave

          def write_tone(path, hz, seconds, rate=44100):
              with wave.open(path, 'wb') as f:
                  f.setnchannels(2)
                  f.setsampwidth(2)
                  f.setframerate(rate)
                  for i in range(int(rate * seconds)):
                      s = int(10000 * math.sin(2 * math.pi * hz * i / rate))
                      frame = struct.pack('<hh', s, s)
                      f.writeframesraw(frame)

          write_tone('/tmp/toh_old.wav', 440, 10)
          write_tone('/tmp/toh_fresh.wav', 880, 10)
          PY

      - name: Pull production Liquidsoap image
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Reproduce interrupted-song retirement through real request.dynamic and cross
        shell: bash
        run: |
          cat > /tmp/toh_resume_regression.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          request_index = ref(0)
          cut_target = ref(0.)
          current_dynamic_title = ref("")

          def next_song() =
            i = request_index()
            request_index := i + 1
            if i == 0 then
              request.create('annotate:title="OLD",song_id="old":/tmp/toh_old.wav')
            else
              request.create('annotate:title="FRESH",song_id="fresh":/tmp/toh_fresh.wav')
            end
          end

          dynamic = request.dynamic(
            id="next_song_test",
            timeout=5.,
            retry_delay=0.1,
            prefetch=1,
            next_song
          )

          def check_after_id() =
            title = current_dynamic_title()
            elapsed = dynamic.elapsed()
            log("TOH_REGRESSION_CURRENT=#{title} elapsed=#{elapsed}")
            if title == "FRESH" and elapsed < 2.0 then
              log("TOH_REGRESSION_PASS")
            else
              log("TOH_REGRESSION_FAIL")
            end
          end

          def dynamic_track(m) =
            title = list.assoc(default="", "title", m)
            current_dynamic_title := title
            log("TOH_REGRESSION_DYNAMIC_TRACK=#{title}")
            if title == "OLD" and cut_target() == 0. then
              cut_target := time() + 2.0
              thread.run(delay=3.4, check_after_id)
            end
          end
          source.methods(dynamic).on_track(synchronous=true, dynamic_track)

          music = fallback(
            id="dynamic_startup_test",
            track_sensitive=false,
            [dynamic, blank(id="startup_blank")]
          )

          # Reproduce the production processing layers that can hold track state.
          music = stretch(ratio=1.0, music)
          def test_cross(old, new) =
            cross.simple(old.source, new.source, fade_in=1.0, fade_out=1.0)
          end
          music = cross(duration=2.0, test_cross, music)
          music_under_toh = music
          music_prefaded = amplify(1.0, music_under_toh)

          legal_id = sine(id="legal_id_test", duration=1.0, 1200.)

          def id_due() =
            target = cut_target()
            target > 0. and time() >= target and time() < target + 1.0
          end

          # This is the current #157 retirement strategy. The executable test is
          # intentionally against the transition argument, not a toy blank source.
          def enter_id(old, new) =
            source.skip(old)
            log("TOH_REGRESSION_ENTER transition-old-skipped")
            new
          end

          def leave_id(_, new) =
            log("TOH_REGRESSION_EXIT")
            new
          end

          radio = switch(
            id="toh_regression_switch",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[enter_id, leave_id],
            [({id_due()}, legal_id), ({true}, music_prefaded)]
          )

          output.dummy(id="toh_regression_output", fallible=true, radio)
          EOF

          set +e
          timeout -k 2s 10s docker run --rm \
            -v /tmp/toh_resume_regression.liq:/tmp/toh_resume_regression.liq:ro \
            -v /tmp/toh_old.wav:/tmp/toh_old.wav:ro \
            -v /tmp/toh_fresh.wav:/tmp/toh_fresh.wav:ro \
            savonet/liquidsoap:v2.4.5 /tmp/toh_resume_regression.liq \
            > /tmp/toh_resume_regression.log 2>&1
          status=$?
          set -e

          cat /tmp/toh_resume_regression.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            echo "Liquidsoap regression harness failed with status $status" >&2
            exit "$status"
          fi

          grep -q 'TOH_REGRESSION_DYNAMIC_TRACK=OLD' /tmp/toh_resume_regression.log
          grep -q 'TOH_REGRESSION_ENTER' /tmp/toh_resume_regression.log
          grep -q 'TOH_REGRESSION_EXIT' /tmp/toh_resume_regression.log
          grep -q 'TOH_REGRESSION_PASS' /tmp/toh_resume_regression.log
          ! grep -q 'TOH_REGRESSION_FAIL' /tmp/toh_resume_regression.log
