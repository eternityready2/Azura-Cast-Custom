name: TOH Playout Regression

on:
  push:
    branches:
      - 'fix/toh-freeze-fresh-song-during-id'
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'util/docker/stations/liquidsoap/**'
      - '.github/workflows/toh-playout-regression.yml'

permissions:
  contents: read

jobs:
  no-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate deterministic test audio
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import struct
          import wave

          RATE = 44100

          def write_segments(path, segments):
              with wave.open(path, 'wb') as f:
                  f.setnchannels(2)
                  f.setsampwidth(2)
                  f.setframerate(RATE)
                  for hz, seconds in segments:
                      frames = int(RATE * seconds)
                      for i in range(frames):
                          s = int(10000 * math.sin(2 * math.pi * hz * i / RATE))
                          f.writeframesraw(struct.pack('<hh', s, s))

          # OLD is the interrupted pre-ID song.
          write_segments('/tmp/toh_old.wav', [(440, 10.0)])
          # FRESH has a unique 880 Hz opening second, then 660 Hz. This proves the
          # post-ID song starts at its beginning instead of advancing under the ID.
          write_segments('/tmp/toh_fresh.wav', [(880, 1.0), (660, 9.0)])
          PY
          rm -rf /tmp/toh_regression_out
          mkdir -p /tmp/toh_regression_out
          chmod 0777 /tmp/toh_regression_out

      - name: Pull production Liquidsoap image
        run: docker pull savonet/liquidsoap:v2.4.5

      - name: Run production-shaped TOH cleanup and release
        shell: bash
        run: |
          cat > /tmp/toh_resume_regression.liq <<'EOF'
          init.daemon := false
          log.stdout := true
          log.file := false
          log.level := 4

          request_index = ref(0)
          cut_target = ref(0.)
          clean_cut_pending = ref(false)
          id_active = ref(false)

          def next_song() =
            i = request_index()
            request_index := i + 1
            if i == 0 then
              request.create('annotate:title="OLD",song_id="old":/tmp/toh_old.wav')
            else
              request.create('annotate:title="FRESH",song_id="fresh":/tmp/toh_fresh.wav')
            end
          end

          # Match production AutoDJ: no synthetic prefetch parameter.
          dynamic = request.dynamic(
            id="next_song_test",
            timeout=5.,
            retry_delay=0.1,
            next_song
          )

          def dynamic_track(m) =
            title = list.assoc(default="", "title", m)
            log("TOH_REGRESSION_DYNAMIC_TRACK=#{title}")
            if title == "OLD" and cut_target() == 0. then
              cut_target := time() + 2.0
            end
          end
          source.methods(dynamic).on_track(synchronous=true, dynamic_track)

          music = fallback(
            id="dynamic_startup_test",
            track_sensitive=false,
            [dynamic, blank(id="startup_blank")]
          )
          music = stretch(ratio=1.0, music)

          def test_cross(old, new) =
            if clean_cut_pending() then
              clean_cut_pending := false
              if id_active() then
                log("TOH_REGRESSION_CROSS clean-cut consumed while ID active")
              else
                log("TOH_REGRESSION_CROSS ERROR clean-cut consumed after ID release")
              end
              new.source
            else
              cross.simple(old.source, new.source, fade_in=1.0, fade_out=1.0)
            end
          end
          music = cross(duration=2.0, test_cross, music)
          music_prefaded = amplify(1.0, music)

          # Clock the processed music graph only until the forced cross boundary
          # has been consumed. Then switch to independent silence so FRESH remains
          # parked at its beginning while the legal ID continues on air.
          let {
            audio=underlay_audio,
            ...underlay_non_audio
          } = source.tracks(music_prefaded)
          ignore(underlay_non_audio)
          cleanup_audio = source(id="cleanup_audio_test", {audio=underlay_audio})
          cleanup_audio = amplify(0.0, cleanup_audio)
          cleanup_idle = blank(id="cleanup_idle_test")
          cleanup_underlay = switch(
            id="cleanup_underlay_test",
            track_sensitive=false,
            replay_metadata=false,
            transition_length=0.0,
            [
              ({clean_cut_pending()}, cleanup_audio),
              ({true}, cleanup_idle)
            ]
          )

          legal_id = sine(id="legal_id_test", duration=3.0, 1200.)
          legal_id_clocked = add(
            id="legal_id_clocked_test",
            normalize=false,
            [legal_id, cleanup_underlay]
          )

          def id_due() =
            target = cut_target()
            if id_active() then
              legal_id.is_ready() or clean_cut_pending()
            else
              target > 0.
              and time() >= target
              and time() < target + 4.0
              and legal_id.is_ready()
            end
          end

          def enter_id(_, new) =
            id_active := true
            clean_cut_pending := true
            source.skip(dynamic)
            log("TOH_REGRESSION_ENTER clean-cut armed and direct dynamic skipped")
            new
          end

          def leave_id(_, new) =
            id_active := false
            log("TOH_REGRESSION_EXIT")
            new
          end

          radio = switch(
            id="toh_regression_switch",
            track_sensitive=false,
            replay_metadata=true,
            transition_length=0.0,
            transitions=[enter_id, leave_id],
            [({id_due()}, legal_id_clocked), ({true}, music_prefaded)]
          )

          output.file(
            %wav(header=false, samplesize=16),
            "/out/output.pcm",
            fallible=true,
            radio
          )
          EOF

          set +e
          timeout -k 2s 12s docker run --rm \
            -v /tmp/toh_resume_regression.liq:/tmp/toh_resume_regression.liq:ro \
            -v /tmp/toh_old.wav:/tmp/toh_old.wav:ro \
            -v /tmp/toh_fresh.wav:/tmp/toh_fresh.wav:ro \
            -v /tmp/toh_regression_out:/out \
            savonet/liquidsoap:v2.4.5 /tmp/toh_resume_regression.liq \
            > /tmp/toh_resume_regression.log 2>&1
          status=$?
          set -e

          cat /tmp/toh_resume_regression.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ] && [ "$status" -ne 137 ]; then
            echo "Liquidsoap regression harness failed with status $status" >&2
            exit "$status"
          fi

          grep -q 'TOH_REGRESSION_DYNAMIC_TRACK=OLD' /tmp/toh_resume_regression.log
          test "$(grep -c 'TOH_REGRESSION_ENTER clean-cut armed and direct dynamic skipped' /tmp/toh_resume_regression.log)" -eq 1
          grep -q 'TOH_REGRESSION_CROSS clean-cut consumed while ID active' /tmp/toh_resume_regression.log
          ! grep -q 'TOH_REGRESSION_CROSS ERROR' /tmp/toh_resume_regression.log
          grep -q 'TOH_REGRESSION_EXIT' /tmp/toh_resume_regression.log
          test -s /tmp/toh_regression_out/output.pcm

      - name: Assert no resume, no silent advance, and no post-ID gap
        shell: bash
        run: |
          python3 - <<'PY'
          import math
          import pathlib
          import struct

          path = pathlib.Path('/tmp/toh_regression_out/output.pcm')
          raw = path.read_bytes()
          if len(raw) < 44100 * 4 * 6:
              raise SystemExit(f'Output too short: {len(raw)} bytes')

          vals = struct.unpack('<' + 'h' * (len(raw) // 2), raw[:len(raw) // 2 * 2])
          samples = vals[0::2]
          rate = 44100
          win = rate // 10
          hop = rate // 20

          def goertzel(xs, freq):
              omega = 2.0 * math.pi * freq / rate
              coeff = 2.0 * math.cos(omega)
              s1 = 0.0
              s2 = 0.0
              for x in xs:
                  s0 = x + coeff * s1 - s2
                  s2, s1 = s1, s0
              power = s1 * s1 + s2 * s2 - coeff * s1 * s2
              return power / (len(xs) * len(xs))

          windows = []
          for start in range(0, len(samples) - win + 1, hop):
              xs = samples[start:start + win]
              p440 = goertzel(xs, 440.0)
              p660 = goertzel(xs, 660.0)
              p880 = goertzel(xs, 880.0)
              p1200 = goertzel(xs, 1200.0)
              rms = math.sqrt(sum(float(x) * float(x) for x in xs) / len(xs))
              windows.append((start / rate, p440, p660, p880, p1200, rms))

          id_windows = [
              w for w in windows
              if w[4] > 20.0 * (w[1] + w[2] + w[3] + 1.0) and w[4] > 1e5
          ]
          if not id_windows:
              raise SystemExit('Could not locate deterministic 1200 Hz ID in recorded output')

          id_start = min(w[0] for w in id_windows)
          id_end = max(w[0] for w in id_windows) + win / rate
          print(f'ID detected from about {id_start:.3f}s to {id_end:.3f}s')

          post = [w for w in windows if id_end + 0.02 <= w[0] <= id_end + 1.75]
          if not post:
              raise SystemExit('No post-ID analysis windows')

          # 1) Interrupted OLD song must never reappear after ID.
          old_leaks = []
          for t, p440, p660, p880, p1200, rms in post:
              if p440 > 1e5 and p440 > 0.02 * (p660 + p880 + 1.0):
                  old_leaks.append((t, p440, p660, p880, p1200, rms))
          if old_leaks:
              for row in old_leaks:
                  print('OLD_LEAK %.3fs p440=%.0f p660=%.0f p880=%.0f p1200=%.0f rms=%.0f' % row)
              raise SystemExit('TOH_REGRESSION_FAIL: interrupted song exists after ID')

          # 2) Fresh song must begin immediately. Require audible non-ID signal
          # within 250 ms of the end of the ID; this catches long post-ID silence.
          immediate = [w for w in post if w[0] <= id_end + 0.25]
          if not immediate or not any(w[5] > 500.0 for w in immediate):
              raise SystemExit('TOH_REGRESSION_FAIL: fresh song did not begin within 250 ms after ID')

          # 3) Fresh song must still be at its unique 880 Hz opening. If 660 Hz
          # is already dominant, the fresh song advanced silently beneath the ID.
          intro = [w for w in post if w[0] <= id_end + 0.55]
          intro_880 = [
              w for w in intro
              if w[3] > 1e5 and w[3] > 5.0 * (w[1] + w[2] + w[4] + 1.0)
          ]
          if not intro_880:
              raise SystemExit('TOH_REGRESSION_FAIL: fresh song did not start from its beginning')

          # By roughly 1.3s post-ID the 660 Hz body should become dominant, which
          # also proves the fresh source is advancing normally once released.
          body = [w for w in post if id_end + 1.05 <= w[0] <= id_end + 1.55]
          body_660 = [
              w for w in body
              if w[2] > 1e5 and w[2] > 5.0 * (w[1] + w[3] + w[4] + 1.0)
          ]
          if not body_660:
              raise SystemExit('TOH_REGRESSION_FAIL: fresh song did not advance normally after release')

          print('TOH_REGRESSION_PASS: old song gone, fresh song starts immediately at 0:00, no post-ID gap')
          PY
