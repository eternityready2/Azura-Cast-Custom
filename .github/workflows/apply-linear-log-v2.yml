name: Apply Linear Log V2

on:
  push:
    branches:
      - feature/linear-log-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/linear-log-v2
          fetch-depth: 0

      - name: Reassemble and apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/linear-log-v2/patch.part00 \
              .github/linear-log-v2/patch.part01 \
              .github/linear-log-v2/patch.part02 > /tmp/linear-log-v2.patch.gz.b64
          base64 --decode /tmp/linear-log-v2.patch.gz.b64 | gzip --decompress > /tmp/linear-log-v2.patch
          test "$(sha256sum /tmp/linear-log-v2.patch | awk '{print $1}')" = "b051ee6f196a4205a0e14be4db115d27a9be1178d201c0289a32525cc290e840"
          git apply --check /tmp/linear-log-v2.patch
          git apply /tmp/linear-log-v2.patch
          rm -rf .github/linear-log-v2
          rm -f .github/workflows/apply-linear-log-v2.yml
          git diff --check

      - name: Commit Linear Log V2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Linear Log V2 preview and reporting"
          git push origin HEAD:feature/linear-log-v2
