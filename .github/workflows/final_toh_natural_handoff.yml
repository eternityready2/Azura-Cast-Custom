name: Final TOH Natural Handoff

on:
  push:
    branches:
      - fix/toh-natural-handoff-final

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toh-natural-handoff-final
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

      - name: Apply final TOH continuity repair
        run: python3 .github/scripts/apply_toh_repair.py

      - name: Syntax and focused regression tests
        shell: bash
        run: |
          php -l backend/src/Radio/AutoDJ/TopOfHourIdScheduler.php
          php -l backend/src/Radio/AutoDJ/Queue.php
          php -l backend/src/Radio/AutoDJ/QueueBuilder.php
          php -l backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php
          php -l backend/src/Radio/Backend/Liquidsoap/TopOfHourNewsConfigWriter.php
          php -l tests/Unit/TopOfHourNaturalHandoffTest.php
          php -l tests/Unit/TopOfHourContinuityIntegrationTest.php
          php -l tests/Unit/TopOfHourNewsPriorityTest.php
          php -l tests/Unit/LinearLogBoundaryContinuityTest.php
          vendor/bin/phpunit \
            tests/Unit/TopOfHourNaturalHandoffTest.php \
            tests/Unit/TopOfHourContinuityIntegrationTest.php \
            tests/Unit/TopOfHourNewsPriorityTest.php \
            tests/Unit/LinearLogBoundaryContinuityTest.php \
            tests/Unit/TopOfHourSequencePlannerTest.php \
            tests/Unit/TopOfHourSmartBacktimingTest.php \
            tests/Unit/TopOfHourFeedbackTest.php \
            tests/Unit/AiDjRealtimeQueueListenerTest.php
          git diff --check

      - name: Source-contract safety checks
        shell: bash
        run: |
          ! grep -Fq 'top_of_hour_preboundary_hold' backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php
          ! grep -Fq 'PRE_BOUNDARY_HOLD_SECONDS' backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php
          grep -Fq 'id="top_of_hour_natural_handoff"' backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php
          grep -Fq 'track_sensitive=true,' backend/src/Radio/Backend/Liquidsoap/TopOfHourConfigWriter.php
          grep -Fq 'id="top_of_hour_priority_natural_handoff"' backend/src/Radio/Backend/Liquidsoap/TopOfHourNewsConfigWriter.php
          grep -Fq 'cron.add("58 * * *' backend/src/Radio/Backend/Liquidsoap/TopOfHourNewsConfigWriter.php
          grep -Fq 'getIdWindowLeadSeconds($station)' backend/src/Radio/AutoDJ/TopOfHourIdScheduler.php
          grep -Fq 'prebuilding post-ID audio' backend/src/Radio/AutoDJ/Queue.php
          grep -Fq 'naturally fitting record' backend/src/Radio/AutoDJ/QueueBuilder.php
          grep -Fq 'refusing to turn a normal music track into a routine TOH cut/fade.' backend/src/Radio/AutoDJ/QueueBuilder.php
          ! grep -Fq 'top_of_hour_pre_id_fade = true' backend/src/Radio/AutoDJ/QueueBuilder.php

      - name: Commit validated repair and remove temporary helpers
        shell: bash
        run: |
          rm .github/workflows/final_toh_natural_handoff.yml
          rm .github/scripts/apply_toh_repair.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make TOH handoff continuous at natural track boundaries'
          git push origin HEAD:fix/toh-natural-handoff-final
