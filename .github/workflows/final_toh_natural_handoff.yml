name: Final TOH Natural Handoff

on:
  push:
    branches:
      - fix/toh-natural-handoff-final

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toh-natural-handoff-final
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-reqs

      - name: Apply final TOH continuity repair
        shell: bash
        env:
          REPAIR_SCRIPT_B64: "'" 
        run: |
          printf '%s' "$REPAIR_SCRIPT_B64" | base64 -d > /tmp/apply_toh_repair.py
          python3 /tmp/apply_toh_repair.py
