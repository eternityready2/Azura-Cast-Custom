name: TOH Rebuild Validation

on:
  push:
    branches:
      - rebuild/top-of-hour-broadcast-id

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate diff and removed legacy files
        run: |
          git diff --check origin/dev...HEAD
          test ! -e backend/src/Radio/AutoDJ/TopOfHourIdScheduler.php
          test ! -e backend/src/Radio/AutoDJ/HourBoundaryAnnotator.php
          test ! -e backend/src/Radio/AutoDJ/HourBoundaryLegalIdResolver.php
          test ! -e tests/Unit/TopOfHourIdSchedulerTest.php
          test ! -e docs/top-of-hour-id-plan.md
          ! grep -R "top_of_hour_requests\|apply_top_of_hour_hard_trigger" backend/src util/docker/stations/liquidsoap frontend

      - name: PHP syntax check changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/dev...HEAD -- '*.php' | while read -r f; do test -f "$f" && echo "$f"; done)
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Install PHP analysis dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast PHPStan runtime
        run: |
          sudo mkdir -p /var/azuracast/www/plugins
          cat > phpstan.toph.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF

      - name: PHPStan TOH integration
        run: >-
          vendor/bin/phpstan analyze -c phpstan.toph.neon --memory-limit=-1 --no-progress
          backend/src/Controller/Api/Stations/TopOfHour
          backend/src/Entity/StationBackendConfiguration.php
          backend/src/Entity/StationQueue.php
          backend/src/Radio/AutoDJ/TopOfHour
          backend/src/Radio/AutoDJ/BroadcastClockPlanner.php
          backend/src/Radio/AutoDJ/Queue.php
          backend/src/Radio/AutoDJ/ClockWheel/ClockWheelAnnotator.php
          backend/src/Radio/AutoDJ/ContentTypeCrossfadeAnnotator.php
          backend/src/Radio/Backend/Liquidsoap/TopOfHourAiNewsConfigurationGuard.php
          backend/src/Sync/Task/QueueInterruptingTracks.php
          tests/Unit/TopOfHourClockTest.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check rebuilt Top-of-Hour frontend
        run: |
          cat > tsconfig.toph.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "frontend/**/*.d.ts",
              "frontend/components/Stations/TopOfHour.vue",
              "frontend/entities/TopOfHour.ts"
            ],
            "exclude": ["node_modules"]
          }
          EOF
          npx vue-tsc -p tsconfig.toph.json --noEmit

      - name: Lint rebuilt Top-of-Hour frontend
        run: npx eslint frontend/components/Stations/TopOfHour.vue frontend/entities/TopOfHour.ts
