name: PR124 Finalize V2

on:
  push:
    branches:
      - fix/toh-backtiming-linear-log-persistence-playout-controls

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --ignore-platform-reqs --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Apply final review fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # P1: Only use an overlong TOH music fallback after every eligible
          # source/group member has had both fitting passes.
          q = 'backend/src/Radio/AutoDJ/QueueBuilder.php'
          replace_once(q,
              "        bool $singleTrackOnly = false,\n        bool $deferQueuePersistence = false,\n    ): StationQueue|array|null {",
              "        bool $singleTrackOnly = false,\n        bool $deferQueuePersistence = false,\n        bool $allowTopOfHourFallback = false,\n    ): StationQueue|array|null {")
          replace_once(q,
              "                $expectedPlayTime,\n                $allowDuplicates\n            );",
              "                $expectedPlayTime,\n                $allowDuplicates,\n                $allowTopOfHourFallback,\n            );")
          replace_once(q,
              "                    $expectedPlayTime,\n                    $allowDuplicates,\n                );",
              "                    $expectedPlayTime,\n                    $allowDuplicates,\n                    $allowTopOfHourFallback,\n                );")
          replace_once(q,
              "        DateTimeImmutable $expectedPlayTime,\n        bool $allowDuplicates,\n    ): StationQueue|array|null {",
              "        DateTimeImmutable $expectedPlayTime,\n        bool $allowDuplicates,\n        bool $allowTopOfHourFallback,\n    ): StationQueue|array|null {")
          replace_once(q,
              "                true,\n                true,\n            );\n\n            if (null === $selection && !$allowDuplicates) {",
              "                true,\n                true,\n                $allowTopOfHourFallback,\n            );\n\n            if (null === $selection && !$allowDuplicates) {")
          replace_once(q,
              "                    true,\n                    true,\n                    true,\n                );\n            }",
              "                    true,\n                    true,\n                    true,\n                    $allowTopOfHourFallback,\n                );\n            }")
          replace_once(q,
              "        DateTimeImmutable $expectedPlayTime,\n        bool $allowDuplicates,\n    ): ?StationPlaylistQueue {",
              "        DateTimeImmutable $expectedPlayTime,\n        bool $allowDuplicates,\n        bool $allowTopOfHourFallback,\n    ): ?StationPlaylistQueue {")
          replace_once(q,
              "if ($allowDuplicates && is_array($fallback)) {",
              "if ($allowTopOfHourFallback && is_array($fallback)) {")
          replace_once(q,
              "        foreach ($typesToPlay as $type) {\n            $typesToPlayByPriority[] = $type . '_scheduled';\n            $typesToPlayByPriority[] = $type . '_unscheduled';\n        }\n\n        foreach ($typesToPlayByPriority as $currentPlaylistType) {",
              "        foreach ($typesToPlay as $type) {\n            $typesToPlayByPriority[] = $type . '_scheduled';\n            $typesToPlayByPriority[] = $type . '_unscheduled';\n        }\n\n        $topOfHourFallbackPlaylists = [];\n\n        foreach ($typesToPlayByPriority as $currentPlaylistType) {")
          replace_once(q,
              "            $eligiblePlaylists = $this->weightedShuffle($eligiblePlaylists);\n\n            foreach ([false, true] as $allowDuplicates) {",
              "            $eligiblePlaylists = $this->weightedShuffle($eligiblePlaylists);\n            foreach (array_keys($eligiblePlaylists) as $playlistId) {\n                $topOfHourFallbackPlaylists[$playlistId] =\n                    $activePlaylistsByType[$currentPlaylistType][$playlistId];\n            }\n\n            foreach ([false, true] as $allowDuplicates) {")
          replace_once(q,
              "        if ($event->isInterrupting()) {\n            $this->logger->info('No interrupting tracks to play.');\n        } else {\n            $this->logger->error('No playable tracks were found.');\n        }",
              "        if (\n            !$event->isInterrupting()\n            && $topOfHourFallbackPlaylists !== []\n            && $this->hourBoundaryPlanner->isInLookaheadZone($station, $expectedPlayTime)\n        ) {\n            foreach ($topOfHourFallbackPlaylists as $playlist) {\n                if (!$this->scheduler->shouldPlaylistPlayNow($playlist, $expectedPlayTime)) {\n                    continue;\n                }\n\n                if (\n                    $event->setNextSongs(\n                        $this->playSongFromPlaylist(\n                            $playlist,\n                            $recentSongHistoryForDuplicatePrevention,\n                            $expectedPlayTime,\n                            true,\n                            false,\n                            false,\n                            true,\n                        )\n                    )\n                ) {\n                    $this->logger->warning(\n                        'TOH backtiming exhausted fitting sources; using a full-song safety fallback.',\n                        ['playlist_id' => $playlist->id]\n                    );\n                    return;\n                }\n            }\n        }\n\n        if ($event->isInterrupting()) {\n            $this->logger->info('No interrupting tracks to play.');\n        } else {\n            $this->logger->error('No playable tracks were found.');\n        }")

          # P1: Persist the exact boundary a TOH ID serves. Actual/cue timing can
          # drift after queue recalculation and must not redefine the hour.
          replace_once('backend/src/Entity/StationQueue.php',
              "    /** True when queued by station-wide top-of-hour protection (v0.29). */\n    #[ORM\\Column]\n    public bool $top_of_hour_legal_id = false;\n\n    /** Whether AnnotateNextSong should apply a cue_out cap for hour-boundary protection. */",
              "    /** True when queued by station-wide top-of-hour protection (v0.29). */\n    #[ORM\\Column]\n    public bool $top_of_hour_legal_id = false;\n\n    /** Immutable top-of-hour boundary this mandatory ID was queued to serve. */\n    #[ORM\\Column(type: 'datetime_immutable', precision: 6, nullable: true)]\n    public ?DateTimeImmutable $top_of_hour_expected_at = null {\n        set (DateTimeImmutable|string|null $value) => Time::toNullableUtcCarbonImmutable($value);\n    }\n\n    /** Whether AnnotateNextSong should apply a cue_out cap for hour-boundary protection. */")
          replace_once('backend/src/Radio/AutoDJ/HourBoundaryLegalIdResolver.php',
              "        $queueEntry = StationQueue::fromMedia($station, $media);\n        $queueEntry->top_of_hour_legal_id = true;\n        $queueEntry->clock_wheel_legal_id_substitute = $usedSubstitute;",
              "        $queueEntry = StationQueue::fromMedia($station, $media);\n        $queueEntry->top_of_hour_legal_id = true;\n        $queueEntry->top_of_hour_expected_at = $legalIdExpectedAt;\n        $queueEntry->clock_wheel_legal_id_substitute = $usedSubstitute;")
          replace_once('backend/src/Entity/Migration/Version20260902030000.php',
              "        );\n    }\n\n    public function down(Schema $schema): void\n    {\n        $this->addSql('DROP TABLE IF EXISTS station_linear_log_snapshots');\n    }",
              "        );\n\n        $this->addSql(\n            'ALTER TABLE station_queue\n             ADD COLUMN IF NOT EXISTS top_of_hour_expected_at DATETIME(6) DEFAULT NULL'\n        );\n    }\n\n    public function down(Schema $schema): void\n    {\n        $this->addSql(\n            'ALTER TABLE station_queue\n             DROP COLUMN IF EXISTS top_of_hour_expected_at'\n        );\n        $this->addSql('DROP TABLE IF EXISTS station_linear_log_snapshots');\n    }")

          repo = Path('backend/src/Entity/Repository/StationQueueRepository.php')
          text = repo.read_text(encoding='utf-8')
          marker = "    /**\n     * Timestamps of already-AIRED (is_played = 1) mandatory legal IDs whose\n"
          if marker not in text:
              raise SystemExit('StationQueueRepository history marker missing')
          exact = """    public function hasTopOfHourLegalIdForBoundary(\n        Station $station,\n        DateTimeImmutable $boundary,\n    ): bool {\n        $result = $this->em->createQuery(\n            <<<'DQL'\n                SELECT sq.id\n                FROM App\\Entity\\StationQueue sq\n                WHERE sq.station = :station\n                AND sq.top_of_hour_legal_id = 1\n                AND sq.top_of_hour_expected_at = :boundary\n            DQL\n        )->setParameter('station', $station)\n            ->setParameter('boundary', $boundary)\n            ->setMaxResults(1)\n            ->getOneOrNullResult();\n\n        return null !== $result;\n    }\n\n"""
          text = text.replace(marker, exact + marker, 1)
          old_query = """                SELECT sq.timestamp_played\n                FROM App\\Entity\\StationQueue sq\n                LEFT JOIN sq.media sm\n                WHERE sq.station = :station\n                AND sq.is_played = 1\n                AND sq.timestamp_played >= :windowStart\n                AND sq.timestamp_played <= :windowEnd\n                AND (\n                    sq.top_of_hour_legal_id = 1\n                    OR sm.type IN (:idTypes)\n                )\n"""
          new_query = """                SELECT sq.timestamp_cued\n                FROM App\\Entity\\StationQueue sq\n                WHERE sq.station = :station\n                AND sq.is_played = 1\n                AND sq.top_of_hour_legal_id = 1\n                AND sq.top_of_hour_expected_at IS NULL\n                AND sq.timestamp_played >= :windowStart\n                AND sq.timestamp_played <= :windowEnd\n"""
          if old_query not in text:
              raise SystemExit('StationQueueRepository legacy query marker missing')
          text = text.replace(old_query, new_query, 1)
          text = text.replace("            ->setParameter('idTypes', StationMediaTypes::stationIdTypeValues())\n", "", 1)
          text = text.replace("static fn (array $row): DateTimeImmutable => $row['timestamp_played']",
                              "static fn (array $row): DateTimeImmutable => $row['timestamp_cued']", 1)
          repo.write_text(text, encoding='utf-8')

          planner = Path('backend/src/Radio/AutoDJ/HourBoundaryPlanner.php')
          text = planner.read_text(encoding='utf-8')
          text = text.replace("use App\\Entity\\Enums\\StationMediaTypes;\n", "", 1)
          start_marker = "        $targetTimestamp = $hourStart->getTimestamp();\n\n        // Check playback history first: if the mandatory ID for this hour has\n"
          if start_marker not in text:
              raise SystemExit('HourBoundaryPlanner history marker missing')
          start = text.index(start_marker)
          hist = text.index("        $historyWindowStart =", start)
          prefix = """        $targetTimestamp = $hourStart->getTimestamp();\n\n        if ($this->queueRepo->hasTopOfHourLegalIdForBoundary($station, $hourStart->toDateTimeImmutable())) {\n            return true;\n        }\n\n        // Compatibility for TOH rows created before exact boundary identity existed.\n"""
          text = text[:start] + prefix + text[hist:]
          text = text.replace(
              "            ) as $playedAt\n        ) {\n            $servedBoundary = $this->resolveTopOfHourExpectedPlayAt($station, $playedAt);\n",
              "            ) as $cuedAt\n        ) {\n            $servedBoundary = $this->resolveLegacyTopOfHourBoundary($station, $cuedAt);\n", 1)
          old_unplayed = """        foreach ($this->queueRepo->getUnplayedQueue($station) as $row) {\n            $isLegalId = $row->top_of_hour_legal_id;\n\n            if (!$isLegalId) {\n                $media = $row->media;\n                $isLegalId = $media !== null && StationMediaTypes::isStationId($media->type);\n            }\n\n            if (!$isLegalId) {\n                continue;\n            }\n\n            // timestamp_played is null while a row is unplayed, so it cannot be\n            // used to locate an already-queued ID. Derive the boundary this ID\n            // serves from its cue time instead: a top-of-hour ID is cued to air\n            // within ~a minute of the :00 it protects. Reusing\n            // resolveTopOfHourExpectedPlayAt() keeps this in lockstep with the\n            // boundary the scheduler is currently targeting.\n            $servedBoundary = $this->resolveTopOfHourExpectedPlayAt($station, $row->timestamp_cued);\n"""
          new_unplayed = """        foreach ($this->queueRepo->getUnplayedQueue($station) as $row) {\n            if (!$row->top_of_hour_legal_id || null !== $row->top_of_hour_expected_at) {\n                continue;\n            }\n\n            $servedBoundary = $this->resolveLegacyTopOfHourBoundary($station, $row->timestamp_cued);\n"""
          if old_unplayed not in text:
              raise SystemExit('HourBoundaryPlanner unplayed marker missing')
          text = text.replace(old_unplayed, new_unplayed, 1)
          helper_marker = "    private function clampInt(int $value, int $min, int $max, int $default): int\n"
          helper = """    private function resolveLegacyTopOfHourBoundary(\n        Station $station,\n        DateTimeImmutable $referenceTime,\n    ): DateTimeImmutable {\n        $local = CarbonImmutable::instance($referenceTime)->setTimezone($station->getTimezoneObject());\n        $hourStart = $local->startOf('hour');\n        $nextHour = $hourStart->addHour();\n\n        $served = abs($local->getTimestamp() - $hourStart->getTimestamp())\n            <= abs($nextHour->getTimestamp() - $local->getTimestamp())\n            ? $hourStart\n            : $nextHour;\n\n        return $served->toDateTimeImmutable();\n    }\n\n"""
          if helper_marker not in text:
              raise SystemExit('HourBoundaryPlanner helper marker missing')
          text = text.replace(helper_marker, helper + helper_marker, 1)
          planner.write_text(text, encoding='utf-8')

          # P1: Scheduled Boundary Protection only considers genuinely strict
          # playlist and Clock Wheel schedules.
          scheduler = Path('backend/src/Radio/AutoDJ/Scheduler.php')
          text = scheduler.read_text(encoding='utf-8')
          if 'use App\\Entity\\Enums\\ClockWheelScheduleMode;' not in text:
              text = text.replace('use App\\Entity\\Enums\\PlaylistTypes;\n',
                                  'use App\\Entity\\Enums\\ClockWheelScheduleMode;\nuse App\\Entity\\Enums\\PlaylistTypes;\n', 1)
          text = text.replace(
              """            foreach ($playlist->schedule_items as $scheduleItem) {\n                $allScheduleItems[] = $scheduleItem;\n            }\n""",
              """            foreach ($playlist->schedule_items as $scheduleItem) {\n                if (!$scheduleItem->strict_start) {\n                    continue;\n                }\n                $allScheduleItems[] = $scheduleItem;\n            }\n""", 1)
          text = text.replace(
              """        foreach ($station->clock_wheels as $clockWheel) {\n            foreach ($clockWheel->schedule_items as $scheduleItem) {\n                $allScheduleItems[] = $scheduleItem;\n            }\n        }\n""",
              """        foreach ($station->clock_wheels as $clockWheel) {\n            if (!$clockWheel->is_active) {\n                continue;\n            }\n            foreach ($clockWheel->schedule_items as $scheduleItem) {\n                if ($scheduleItem->clock_wheel_mode !== ClockWheelScheduleMode::Strict) {\n                    continue;\n                }\n                $allScheduleItems[] = $scheduleItem;\n            }\n        }\n""", 1)
          scheduler.write_text(text, encoding='utf-8')

          # P1: ClockWheelAnnotator is only responsible for Clock Wheel caps.
          # Station-wide scheduled-boundary caps are owned by HourBoundaryAnnotator,
          # which already honors the Playout Controls toggle and ignores stale flags.
          replace_once('backend/src/Radio/AutoDJ/ClockWheel/ClockWheelAnnotator.php',
              """        if (null === $queue->clock_wheel || !$queue->clock_wheel_enforce_cap) {\n            if (!$queue->hour_boundary_enforce_cap) {\n                return;\n            }\n\n            $maxSeconds = $queue->hour_boundary_max_play_seconds;\n        } else {\n            $maxSeconds = $queue->clock_wheel_max_play_seconds;\n        }\n""",
              """        if (null === $queue->clock_wheel || !$queue->clock_wheel_enforce_cap) {\n            return;\n        }\n\n        $maxSeconds = $queue->clock_wheel_max_play_seconds;\n""")

          # Regression for immutable hour identity.
          test = Path('tests/Unit/HourBoundaryPlannerTest.php')
          text = test.read_text(encoding='utf-8')
          marker = '    public function testTopOfHourMasterToggleDisablesPlanning(): void\n'
          method = """    public function testTopOfHourBoundaryIdentitySurvivesLatePlayback(): void\n    {\n        $backendConfig = $this->station->backend_config;\n        $backendConfig->top_of_hour_id_enabled = true;\n        $this->station->backend_config = $backendConfig;\n        $this->testsModule->em->persist($this->station);\n\n        $row = new StationQueue($this->station, Song::createFromText('Station - Legal ID'));\n        $row->top_of_hour_legal_id = true;\n        $row->top_of_hour_expected_at = CarbonImmutable::parse('2026-05-26 10:00:00', 'UTC');\n        $row->timestamp_cued = CarbonImmutable::parse('2026-05-26 10:04:00', 'UTC');\n        $row->is_played = true;\n        $row->timestamp_played = CarbonImmutable::parse('2026-05-26 10:04:05', 'UTC');\n        $this->testsModule->em->persist($row);\n        $this->testsModule->em->flush();\n\n        self::assertTrue($this->planner->hasTopOfHourIdQueued(\n            $this->station,\n            CarbonImmutable::parse('2026-05-26 10:00:00', 'UTC'),\n        ));\n        self::assertFalse($this->planner->hasTopOfHourIdQueued(\n            $this->station,\n            CarbonImmutable::parse('2026-05-26 11:00:00', 'UTC'),\n        ));\n    }\n\n"""
          if marker not in text:
              raise SystemExit('HourBoundaryPlannerTest marker missing')
          text = text.replace(marker, method + marker, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Clean and validate code style
        run: |
          mapfile -t php_files < <(git diff --name-only origin/dev...HEAD -- '*.php')
          if [ "${#php_files[@]}" -gt 0 ]; then
            set +e
            vendor/bin/phpcbf "${php_files[@]}"
            code=$?
            set -e
            if [ "$code" -gt 2 ]; then exit "$code"; fi
            vendor/bin/phpcs -n "${php_files[@]}"
            for file in "${php_files[@]}"; do php -l "$file"; done
          fi

          npx eslint --fix \
            frontend/components/Stations/PlayoutControls.vue \
            frontend/components/Stations/TopOfHour.vue \
            frontend/components/Stations/menu.ts \
            frontend/components/Stations/routes.ts \
            frontend/entities/PlayoutControls.ts \
            frontend/entities/TopOfHour.ts
          npx eslint \
            frontend/components/Stations/PlayoutControls.vue \
            frontend/components/Stations/TopOfHour.vue \
            frontend/components/Stations/menu.ts \
            frontend/components/Stations/routes.ts \
            frontend/entities/PlayoutControls.ts \
            frontend/entities/TopOfHour.ts
          git diff --check

      - name: Validate architecture invariants
        run: |
          python3 <<'PY'
          from pathlib import Path
          checks = {
              'backend/src/Radio/AutoDJ/QueueBuilder.php': [
                  'allowTopOfHourFallback',
                  'topOfHourFallbackPlaylists',
                  'TOH backtiming exhausted fitting sources',
              ],
              'backend/src/Entity/StationQueue.php': ['top_of_hour_expected_at'],
              'backend/src/Radio/AutoDJ/HourBoundaryLegalIdResolver.php': [
                  '$queueEntry->top_of_hour_expected_at = $legalIdExpectedAt;'
              ],
              'backend/src/Radio/AutoDJ/HourBoundaryPlanner.php': [
                  'hasTopOfHourLegalIdForBoundary',
                  'resolveLegacyTopOfHourBoundary',
              ],
              'backend/src/Radio/AutoDJ/Scheduler.php': [
                  '$scheduleItem->strict_start',
                  'ClockWheelScheduleMode::Strict',
              ],
              'backend/src/Radio/AutoDJ/ClockWheel/ClockWheelAnnotator.php': [
                  'if (null === $queue->clock_wheel || !$queue->clock_wheel_enforce_cap)'
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Missing invariant {needle!r} in {path}')
          cw = Path('backend/src/Radio/AutoDJ/ClockWheel/ClockWheelAnnotator.php').read_text()
          if '$queue->hour_boundary_max_play_seconds' in cw:
              raise SystemExit('ClockWheelAnnotator still applies station-wide hour-boundary caps')
          PY

      - name: Run focused unit test
        run: vendor/bin/codecept run Unit HourBoundaryPlannerTest --no-interaction

      - name: Commit final code and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr124-finalize.yml .github/workflows/pr124-finalize-v2.yml
          git add -A
          git commit -m "Finalize TOH scheduling and playout controls"
          git push
