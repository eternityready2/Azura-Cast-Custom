name: TOH Retirement Validation

on:
  push:
    branches:
      - 'fix/toh-strict-retirement-quarantine'
  pull_request:
    branches: [dev]
    paths:
      - 'plugins/top_of_hour/**'
      - 'backend/src/Radio/AutoDJ/AutoDjRetirementService.php'
      - 'backend/src/Radio/AutoDJ/Annotations.php'
      - 'backend/src/Radio/Backend/Liquidsoap/Command/NextSongCommand.php'
      - 'backend/src/Radio/Backend/Liquidsoap/Command/FeedbackCommand.php'
      - 'backend/src/Entity/Repository/StationRequestRepository.php'
      - 'tests/Unit/TopOfHourRetirementInvariantTest.php'
      - '.github/workflows/toh-retirement-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Verify retirement architecture
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/dev...HEAD

          test -f backend/src/Radio/AutoDJ/AutoDjRetirementService.php
          test -f plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          test -f plugins/top_of_hour/src/RetiredSongQueueGuard.php

          grep -q 'AutoDjRetirementRuntimeConfiguration::class' plugins/top_of_hour/events.php
          grep -q 'RetiredSongQueueGuard::class' plugins/top_of_hour/events.php
          grep -q "BuildQueue::class => \['guardSelection', -1000\]" plugins/top_of_hour/src/RetiredSongQueueGuard.php

          grep -q 'dynamic.current()' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          grep -q 'dynamic.queue()' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          grep -q 'request.destroy(force=true, req)' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          grep -q 'dynamic.set_queue(\[\])' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          grep -q 'dynamic.skip()' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          grep -q 'exclude_song_id' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          grep -q 'reset_sq_ids' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php
          grep -q 'autodj_generation() > azuracast.autodj_retirement_generation()' plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php

          grep -q 'sq.song_id != :excludedSongId' backend/src/Radio/AutoDJ/AutoDjRetirementService.php
          grep -q 'SET sq.sent_to_autodj = 0' backend/src/Radio/AutoDJ/AutoDjRetirementService.php
          grep -q '\$queueRow->request->played_at = null' backend/src/Radio/AutoDJ/AutoDjRetirementService.php
          grep -q '\$this->retirement->getNextToSendToAutoDj' backend/src/Radio/AutoDJ/Annotations.php
          grep -q '\$this->retirement->activate' backend/src/Radio/Backend/Liquidsoap/Command/NextSongCommand.php
          grep -q '\$this->queue->buildQueue' backend/src/Radio/Backend/Liquidsoap/Command/NextSongCommand.php

          grep -q 'broadcast_clock_rejoin_waiting = ref(false)' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'broadcast_clock_rejoin_deadline' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'fresh AutoDJ rejoin timed out' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
          ! grep -q 'time() + 5.0' plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php

      - name: PHP syntax check changed files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/dev...HEAD -- '*.php' | while read -r f; do test -f "$f" && echo "$f"; done)
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs

      - name: Prepare AzuraCast test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/azuracast/www
          sudo ln -sfn "$PWD/plugins" /var/azuracast/www/plugins
          sudo chown -h "$USER":"$(id -gn)" /var/azuracast/www/plugins || true

      - name: Run TOH retirement regressions
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/codecept run tests/Unit/TopOfHourRetirementInvariantTest.php
          vendor/bin/codecept run tests/Unit/RigidScheduleRuntimeConfigurationTest.php
          vendor/bin/codecept run tests/Unit/TopOfHourRuntimeConfigurationTest.php

      - name: Parse plugin retirement runtime with Liquidsoap 2.4.5
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            require "plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php";
            $station = new App\Entity\Station();
            $station->name = "CI Retirement";
            $station->short_name = "ci_retirement";
            $station->timezone = "UTC";
            $station->radio_base_dir = "/tmp/ci_retirement";
            $event = new App\Event\Radio\WriteLiquidsoapConfiguration($station, false, false);
            (new Plugin\TopOfHour\AutoDjRetirementRuntimeConfiguration())->writeRuntime($event);
            file_put_contents(
              "/tmp/toh-retirement-runtime.liq",
              "%include \"/liq/azuracast.liq\"\n" . $event->buildConfiguration()
            );
          '
          docker run --rm --entrypoint liquidsoap \
            -v "$PWD/util/docker/stations/liquidsoap:/liq:ro" \
            -v /tmp/toh-retirement-runtime.liq:/tmp/toh-retirement-runtime.liq:ro \
            savonet/liquidsoap:v2.4.5 --check /tmp/toh-retirement-runtime.liq

      - name: PHPStan retirement integration
        shell: bash
        run: |
          cat > phpstan.toh-retirement.neon <<'EOF'
          includes:
            - phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: false
          EOF
          vendor/bin/phpstan analyze -c phpstan.toh-retirement.neon --memory-limit=-1 --no-progress \
            backend/src/Radio/AutoDJ/AutoDjRetirementService.php \
            backend/src/Radio/AutoDJ/Annotations.php \
            backend/src/Radio/Backend/Liquidsoap/Command/NextSongCommand.php \
            backend/src/Radio/Backend/Liquidsoap/Command/FeedbackCommand.php \
            backend/src/Entity/Repository/StationRequestRepository.php \
            plugins/top_of_hour/src/AutoDjRetirementRuntimeConfiguration.php \
            plugins/top_of_hour/src/RetiredSongQueueGuard.php \
            plugins/top_of_hour/src/RigidScheduleRuntimeConfiguration.php
