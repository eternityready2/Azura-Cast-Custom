name: PR124 Finalize V5

on:
  push:
    branches:
      - fix/toh-backtiming-linear-log-persistence-playout-controls

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --ignore-platform-reqs --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Apply reviewed fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/pr124-finalize-v2.yml').read_text()
          start = text.index('      - name: Apply final review fixes')
          start = text.index('        run: |', start) + len('        run: |\n')
          end = text.index('\n      - name:', start)
          block = text[start:end]
          lines = [(line[10:] if line.startswith('          ') else line) for line in block.splitlines()]
          Path('/tmp/pr124-apply.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/pr124-apply.sh

      - name: Full source validation
        run: |
          mapfile -t php_files < <(git diff --name-only origin/dev...HEAD -- '*.php')
          if [ "${#php_files[@]}" -gt 0 ]; then
            set +e
            vendor/bin/phpcbf "${php_files[@]}"
            code=$?
            set -e
            if [ "$code" -gt 2 ]; then exit "$code"; fi
            vendor/bin/phpcs -n "${php_files[@]}"
            for file in "${php_files[@]}"; do php -l "$file"; done
          fi
          npx eslint --fix frontend/components/Stations/PlayoutControls.vue frontend/components/Stations/TopOfHour.vue frontend/components/Stations/menu.ts frontend/components/Stations/routes.ts frontend/entities/PlayoutControls.ts frontend/entities/TopOfHour.ts
          npx eslint frontend/components/Stations/PlayoutControls.vue frontend/components/Stations/TopOfHour.vue frontend/components/Stations/menu.ts frontend/components/Stations/routes.ts frontend/entities/PlayoutControls.ts frontend/entities/TopOfHour.ts
          git diff --check

      - name: Assert all four Codex P1 fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          q = Path('backend/src/Radio/AutoDJ/QueueBuilder.php').read_text()
          assert 'bool $allowTopOfHourFallback = false' in q
          assert '$topOfHourFallbackPlaylists = [];' in q
          assert 'TOH backtiming exhausted fitting sources; using a full-song safety fallback.' in q
          assert 'if ($allowTopOfHourFallback && is_array($fallback))' in q

          entity = Path('backend/src/Entity/StationQueue.php').read_text()
          resolver = Path('backend/src/Radio/AutoDJ/HourBoundaryLegalIdResolver.php').read_text()
          planner = Path('backend/src/Radio/AutoDJ/HourBoundaryPlanner.php').read_text()
          repo = Path('backend/src/Entity/Repository/StationQueueRepository.php').read_text()
          migration = Path('backend/src/Entity/Migration/Version20260902030000.php').read_text()
          assert 'top_of_hour_expected_at' in entity
          assert '$queueEntry->top_of_hour_expected_at = $legalIdExpectedAt;' in resolver
          assert 'hasTopOfHourLegalIdForBoundary' in planner
          assert 'resolveLegacyTopOfHourBoundary' in planner
          assert 'top_of_hour_expected_at = :boundary' in repo
          assert 'ADD COLUMN IF NOT EXISTS top_of_hour_expected_at DATETIME(6) DEFAULT NULL' in migration

          scheduler = Path('backend/src/Radio/AutoDJ/Scheduler.php').read_text()
          assert 'if (!$scheduleItem->strict_start)' in scheduler
          assert '$scheduleItem->clock_wheel_mode !== ClockWheelScheduleMode::Strict' in scheduler

          cw = Path('backend/src/Radio/AutoDJ/ClockWheel/ClockWheelAnnotator.php').read_text()
          hb = Path('backend/src/Radio/AutoDJ/HourBoundaryAnnotator.php').read_text()
          assert '$queue->hour_boundary_max_play_seconds' not in cw
          assert 'top_of_hour_hard_trigger_enabled' in hb

          test = Path('tests/Unit/HourBoundaryPlannerTest.php').read_text()
          assert 'testTopOfHourBoundaryIdentitySurvivesLatePlayback' in test
          assert "CarbonImmutable::parse('2026-05-26 10:04:05', 'UTC')" in test
          PY

      - name: Record focused test harness limitation
        run: |
          sudo mkdir -p /var/azuracast/www/plugins /var/azuracast/stations
          sudo chown -R "$(id -u):$(id -g)" /var/azuracast
          set +e
          vendor/bin/codecept run Unit HourBoundaryPlannerTest --no-interaction > /tmp/codecept.log 2>&1
          code=$?
          set -e
          cat /tmp/codecept.log
          if [ "$code" -ne 0 ]; then
            if grep -q 'SQLSTATE\[HY000\] \[2002\] No such file or directory' /tmp/codecept.log; then
              echo 'Focused DB-backed tests could not start because the standalone GitHub runner has no AzuraCast MySQL service; no assertions executed.'
            else
              echo 'Focused tests failed for a reason other than the known missing-MySQL runner environment.' >&2
              exit "$code"
            fi
          fi

      - name: Commit clean final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/pr124-finalize.yml \
            .github/workflows/pr124-finalize-v2.yml \
            .github/workflows/pr124-finalize-v3.yml \
            .github/workflows/pr124-finalize-v4.yml \
            .github/workflows/pr124-finalize-v5.yml
          git add -A
          git commit -m "Finalize TOH scheduling and playout controls"
          git push
