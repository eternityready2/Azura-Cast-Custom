name: Apply Linear Log PR 121 Codex Follow-up

on:
  push:
    branches:
      - fix/linear-log-v2-codex-review

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linear-log-v2-codex-review
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "backend/src/Message/BuildLinearLogMessage.php",
              """        public readonly int $stationId,\n        public readonly int $hours,\n""",
              """        public readonly int $stationId,\n        public readonly int $hours,\n        public readonly bool $force = false,\n""",
          )

          replace(
              "backend/src/Radio/AutoDJ/LinearLogBuilder.php",
              """        if (!$station->backend_config->linear_log_enabled) {\n            $this->snapshotStore->cancelQueued($station);\n            return;\n        }\n""",
              """        if (!$message->force && !$station->backend_config->linear_log_enabled) {\n            $this->snapshotStore->cancelQueued($station);\n            return;\n        }\n""",
          )

          replace(
              "backend/src/Sync/Task/BuildLinearLogTask.php",
              """                $this->messageBus->dispatch(new BuildLinearLogMessage($station->id, $hours));\n""",
              """                $this->messageBus->dispatch(new BuildLinearLogMessage($station->id, $hours, $force));\n""",
          )

          replace(
              "backend/src/Radio/AutoDJ/QueueBuilder.php",
              """        $queueCacheKey = $this->linearLogPreviewContext->cacheKey('playlist_queue.' . $playlist->id);\n        $mediaQueue = $this->cache->get($queueCacheKey);\n        if (empty($mediaQueue)) {\n""",
              """        $liveQueueCacheKey = 'playlist_queue.' . $playlist->id;\n        $queueCacheKey = $this->linearLogPreviewContext->cacheKey($liveQueueCacheKey);\n        $mediaQueue = $this->cache->get($queueCacheKey);\n\n        if ($this->linearLogPreviewContext->isActive() && null === $mediaQueue) {\n            $mediaQueue = $this->cache->get($liveQueueCacheKey);\n        }\n\n        if (empty($mediaQueue)) {\n""",
          )
          PY

      - name: Validate PHP syntax
        run: |
          php -l backend/src/Message/BuildLinearLogMessage.php
          php -l backend/src/Radio/AutoDJ/LinearLogBuilder.php
          php -l backend/src/Radio/AutoDJ/QueueBuilder.php
          php -l backend/src/Sync/Task/BuildLinearLogTask.php

      - name: Validate review invariants
        run: |
          grep -Fq 'public readonly bool $force = false' backend/src/Message/BuildLinearLogMessage.php
          grep -Fq 'if (!$message->force && !$station->backend_config->linear_log_enabled)' backend/src/Radio/AutoDJ/LinearLogBuilder.php
          grep -Fq 'new BuildLinearLogMessage($station->id, $hours, $force)' backend/src/Sync/Task/BuildLinearLogTask.php
          grep -Fq '$mediaQueue = $this->cache->get($liveQueueCacheKey);' backend/src/Radio/AutoDJ/QueueBuilder.php
          git diff --check

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-linear-log-121-codex-followup.yml
          git add backend/src/Message/BuildLinearLogMessage.php \
                  backend/src/Radio/AutoDJ/LinearLogBuilder.php \
                  backend/src/Radio/AutoDJ/QueueBuilder.php \
                  backend/src/Sync/Task/BuildLinearLogTask.php
          git commit -m 'Address Codex follow-up review on PR 121'
          git push origin HEAD:fix/linear-log-v2-codex-review
