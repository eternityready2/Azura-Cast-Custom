name: Part 3 Final Compatibility Audit

on:
  push:
    branches:
      - part3-upstream-sync
    paths:
      - .github/workflows/part3-final-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: curl, ffi, gd, intl, mbstring, redis, xml, maxminddb
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Composer security audit
        run: composer audit --locked --no-interaction
      - name: PHP lint
        run: composer phplint
      - name: PHPStan
        run: composer phpstan

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npm run tsc
      - name: Production build
        run: npm run build

  dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dockerfile build checks
        run: docker build --check .
