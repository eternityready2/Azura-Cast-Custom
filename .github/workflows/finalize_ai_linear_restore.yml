        shell: bash
        run: |
          php -l backend/src/Radio/AutoDJ/AiDjQueueListener.php
          php -l backend/src/Radio/AutoDJ/AiDjRealtimeQueueListener.php
          php -l backend/src/Radio/AutoDJ/Queue.php
