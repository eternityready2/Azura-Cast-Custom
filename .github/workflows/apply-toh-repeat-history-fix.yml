name: Apply TOH Repeat History Fix

on:
  push:
    branches:
      - 'fix/toh-current-song-repeat-guard'
    paths:
      - '.github/workflows/apply-toh-repeat-history-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/toh-current-song-repeat-guard
          fetch-depth: 0

      - name: Patch repeat predecessor ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          queue = Path('backend/src/Radio/AutoDJ/Queue.php')
          text = queue.read_text()
          old = '''        // The on-air song is already marked played when its feedback arrives, so
        // it is normally absent from getUnplayedQueue(). Starting this cursor at
        // null forgets the exact song AutoDJ is currently airing and lets a
        // depleted/rebuilt queue select it again as the first "fresh" request.
        // This is especially visible at TOH: the transport correctly discards
        // the interrupted request, then prefetch can receive the same song as a
        // brand-new request. Carry the actual on-air identity into BuildQueue so
        // the existing immediate-repeat guard can reject it and choose another.
        $lastSongId = $currentSong?->song_id;
'''
          new = '''        // Feedback marks an AutoDJ row played as soon as it takes air, so the
        // current/interrupted music row is normally absent from getUnplayedQueue().
        // During TOH the station's current SongHistory then becomes the ID itself;
        // using current_song here would therefore forget the music that was just
        // interrupted and allow request.dynamic to fetch that exact song again as
        // a supposedly fresh request. Seed the queue cursor from actual played
        // MUSIC history instead. Station IDs, jingles and unplayed projections do
        // not replace this predecessor identity.
        $lastSongId = $this->queueRepo->getMostRecentPlayedMusicSongId($station);
'''
          if old not in text:
              raise SystemExit('Queue predecessor block did not match expected branch content')
          queue.write_text(text.replace(old, new, 1))

          repo = Path('backend/src/Entity/Repository/StationQueueRepository.php')
          text = repo.read_text()
          marker = '''    /**
     * Legal-compliance history (DMCA §114 counting). Unlike getRecentlyPlayedByTimeRange()
'''
          method = '''    /**
     * The last ordinary visible music item that actually took air.
     *
     * This is intentionally independent of current SongHistory: a station-wide
     * clock item (for example the Top-of-Hour ID) can become current metadata
     * immediately after interrupting music. It is also independent of the
     * unplayed queue, because feedback marks the on-air row played at track start.
     */
    public function getMostRecentPlayedMusicSongId(Station $station): ?string
    {
        $row = $this->em->createQuery(
            <<<'DQL'
                SELECT sq.song_id AS song_id
                FROM App\\Entity\\StationQueue sq
                INNER JOIN sq.media sm
                WHERE sq.station = :station
                AND sq.is_played = 1
                AND sq.is_visible = 1
                AND sq.top_of_hour_legal_id = 0
                AND sm.type = 'music'
                ORDER BY sq.timestamp_played DESC, sq.id DESC
            DQL
        )->setParameter('station', $station)
            ->setMaxResults(1)
            ->getOneOrNullResult();

        return is_array($row) ? ($row['song_id'] ?? null) : null;
    }

'''
          if 'public function getMostRecentPlayedMusicSongId(' not in text:
              if marker not in text:
                  raise SystemExit('StationQueueRepository insertion marker not found')
              repo.write_text(text.replace(marker, method + marker, 1))

          test = Path('tests/Unit/TopOfHourRuntimeConfigurationTest.php')
          text = test.read_text()
          text = text.replace(
              '$lastSongId = $currentSong?->song_id;',
              '$lastSongId = $this->queueRepo->getMostRecentPlayedMusicSongId($station);',
          )
          old_comment = '''        // Regression for the live TOH incident: once the current queue row has
        // been marked played it is absent from getUnplayedQueue(). If the cursor
        // starts at null, the replacement queue may choose that exact song again
        // and hand it back to request.dynamic as a supposedly fresh request.
'''
          new_comment = '''        // Regression for the live TOH incident: once the interrupted queue row
        // is marked played and TOH becomes current metadata, neither current_song
        // nor getUnplayedQueue() can identify the music predecessor. The guard
        // must seed from actual played music history instead.
'''
          text = text.replace(old_comment, new_comment)
          extra = '''        self::assertStringNotContainsString(
            '$lastSongId = $currentSong?->song_id;',
            $queueSource,
        );
'''
          needle = '''        self::assertStringNotContainsString(
            "$upcomingQueue = \\$this->queueRepo->getUnplayedQueue(\\$station);\\n\\n        \\$lastSongId = null;",
            $queueSource,
        );
'''
          if extra not in text:
              text = text.replace(needle, needle + extra)
          test.write_text(text)

          build_test = Path('tests/Unit/DmcaComplianceListenerTest.php')
          text = build_test.read_text()
          insert_before = '''    public function testDmcaRunsAfterSelectorAndClearsViolatingPick(): void
'''
          repeat_test = '''    public function testBuildQueueEventDoesNotOwnImmediateRepeatRejection(): void
    {
        $station = $this->makeStation();
        $entry = $this->makeMusicQueueEntry($station, 'Artist', 'Song A', 'Album');
        $event = new BuildQueue($station, lastPlayedSongId: $entry->song_id);

        // Queue::buildQueue owns the retry budget. BuildQueue must preserve the
        // selector result so the queue can retry when alternatives exist but
        // still fail open on the final attempt for a one-song library.
        self::assertTrue($event->setNextSongs($entry));
        self::assertSame([$entry], $event->getNextSongs());
    }

'''
          if repeat_test not in text:
              if insert_before not in text:
                  raise SystemExit('DMCA test insertion marker not found')
              build_test.write_text(text.replace(insert_before, repeat_test + insert_before, 1))
          PY

          php -l backend/src/Radio/AutoDJ/Queue.php
          php -l backend/src/Entity/Repository/StationQueueRepository.php
          php -l tests/Unit/TopOfHourRuntimeConfigurationTest.php
          php -l tests/Unit/DmcaComplianceListenerTest.php

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eternity Ready, LLC.'
          git config user.email '73216191+eternityready2@users.noreply.github.com'
          git add backend/src/Radio/AutoDJ/Queue.php \
                  backend/src/Entity/Repository/StationQueueRepository.php \
                  tests/Unit/TopOfHourRuntimeConfigurationTest.php \
                  tests/Unit/DmcaComplianceListenerTest.php
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'Preserve interrupted music identity across TOH'
          git push origin HEAD:fix/toh-current-song-repeat-guard
